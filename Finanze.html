function finErr(msg, disponibili) {
  var o = { errore: msg };
  if (disponibili) o.valoriDisponibili = disponibili;
  return o;
}

/* Esecuzione locale di uno strumento. Torna sempre un oggetto
   serializzabile; le due azioni tornano `proposta`, mai una scrittura. */
function finEsegui(nome, args, ctx) {
  var a = args || {};
  if (!ctx || !ctx.data || !ctx.data.anni) return { errore: "Archivio non caricato: nessun dato disponibile." };
  var oggi = finOggi(ctx);
  var anno = a.anno != null ? Math.round(a.anno) : finY(oggi);
  var mese = a.mese != null && a.mese >= 0 && a.mese <= 11 ? Math.round(a.mese) : null;
  var cats = finCategorie(ctx);
  var risolviCat = function (v) {
    if (!v) return null;
    var c = finTrovaCat(v, cats, true);
    return c || null;
  };

  try {
    switch (nome) {
      case "situazione": {
        var mod = finModello(ctx.data, anno, [], ctx.data.cats);
        if (!mod) return finErr("Nessun dato per l'anno " + anno + ".", ctx.data.anni);
        var mi = mese == null ? finM(oggi) : mese;
        var r = mod.rows[mi];
        var delMese = finFiltra(ctx, { anno: anno, mese: mi });
        return { periodo: finEtichettaMese(anno, mi),
          entratePreviste: finR2(r.entrate), entrateIncassate: finR2(r.entrateIn), entrateAttese: finR2(r.entrateAtt),
          giornoAccredito: r.giornoEnt || (ctx.data.giornoAccredito || null),
          usciteTotali: finR2(r.usciteTot), giaPagato: finR2(r.paidTot), daPagare: finR2(r.dueTot),
          diCuiSuCarta: finR2(r.ccTot), necessarie: finR2(r.necTot), vita: finR2(r.vitaTot),
          saldoAdesso: finR2(r.saldoOra), contoAFineMese: finR2(r.projectedCC),
          sottoSoglia: r.projectedCC < ctx.soglia, soglia: ctx.soglia,
          movimenti: delMese.length,
          nota: "Saldo di adesso = saldo iniziale + entrate INCASSATE - spese gia' pagate. Conto a fine mese = proiezione con le entrate previste e tutte le uscite." };
      }
      case "spese_per_categoria": {
        var lista = finFiltra(ctx, { anno: anno, mese: mese });
        if (!lista.length) return { periodo: mese == null ? String(anno) : finEtichettaMese(anno, mese), categorie: [], nota: "Nessun movimento nel periodo." };
        var tot = finTot(lista), mappa = {};
        lista.forEach(function (m) {
          if (!mappa[m.cat]) mappa[m.cat] = { categoria: m.cat, totale: 0, n: 0, necessita: m.nec };
          mappa[m.cat].totale += m.amount; mappa[m.cat].n++;
        });
        var out = Object.keys(mappa).map(function (k) {
          var v = mappa[k];
          return { categoria: v.categoria, totale: finR2(v.totale), movimenti: v.n,
            quota: finR2(v.totale / tot * 100), necessita: v.necessita };
        }).sort(function (x, y) { return y.totale - x.totale; }).slice(0, a.limite || 10);
        return { periodo: mese == null ? String(anno) : finEtichettaMese(anno, mese), totale: tot, categorie: out };
      }
      case "dettaglio_categoria": {
        var cat = risolviCat(a.categoria);
        if (!cat) return finErr("Categoria non trovata.", cats);
        var mv = finFiltra(ctx, { categoria: cat, anno: a.anno != null ? anno : null });
        if (!mv.length) return { categoria: cat, totale: 0, nota: "Nessun movimento" + (a.anno != null ? " nel " + anno : "") + "." };
        var perMese = {}, mesiSet = {};
        mv.forEach(function (m) {
          var k = m.y + "-" + finPad(m.m + 1);
          perMese[k] = finR2((perMese[k] || 0) + m.amount);
          mesiSet[k] = 1;
        });
        var nMesi = Object.keys(mesiSet).length, totC = finTot(mv);
        return { categoria: cat, periodo: a.anno != null ? String(anno) : "tutti gli anni",
          totale: totC, movimenti: mv.length, mesiConSpesa: nMesi,
          mediaAVolta: finR2(totC / mv.length), mediaAlMese: finR2(totC / nMesi),
          necessita: mv[0].nec, tipoPrevalente: (ctx.data.catTipo || {})[cat] || mv[0].tipo,
          perMese: perMese,
          ultimi: mv.slice(-8).reverse().map(function (m) {
            return { data: m.dateISO || finEtichettaMese(m.y, m.m), importo: finR2(m.amount), nota: m.note, pagata: !!m.paid, carta: !!m.cc };
          }),
          nota: "La media al mese e' sui mesi in cui la spesa c'e' stata davvero, non sui 12 dell'anno." };
      }
      case "cerca_movimenti": {
        var f = { testo: a.testo || null, anno: a.anno != null ? anno : null, mese: mese,
          importoMin: a.importoMin, importoMax: a.importoMax, soloDaPagare: !!a.soloDaPagare };
        if (a.categoria) {
          var cc = risolviCat(a.categoria);
          if (!cc) return finErr("Categoria non trovata.", cats);
          f.categoria = cc;
        }
        var res = finFiltra(ctx, f);
        var lim = a.limite || 20;
        return { trovati: res.length, totale: finTot(res), mostrati: Math.min(lim, res.length),
          movimenti: res.slice(-lim).reverse().map(function (m) {
            return { data: m.dateISO || finEtichettaMese(m.y, m.m), categoria: m.cat, importo: finR2(m.amount),
              nota: m.note, pagata: !!m.paid, carta: !!m.cc, tipo: m.tipo };
          }) };
      }
      case "confronta_periodi": {
        var p1 = { anno: a.anno1 != null ? Math.round(a.anno1) : anno, mese: a.mese1 != null ? Math.round(a.mese1) : null };
        var p2 = { anno: a.anno2 != null ? Math.round(a.anno2) : anno, mese: a.mese2 != null ? Math.round(a.mese2) : null };
        var cat2 = a.categoria ? risolviCat(a.categoria) : null;
        if (a.categoria && !cat2) return finErr("Categoria non trovata.", cats);
        var l1 = finFiltra(ctx, { anno: p1.anno, mese: p1.mese, categoria: cat2 });
        var l2 = finFiltra(ctx, { anno: p2.anno, mese: p2.mese, categoria: cat2 });
        var t1 = finTot(l1), t2 = finTot(l2);
        var perCat = function (list) {
          var mp = {};
          list.forEach(function (m) { mp[m.cat] = finR2((mp[m.cat] || 0) + m.amount); });
          return mp;
        };
        var c1 = perCat(l1), c2 = perCat(l2), chiavi = {};
        Object.keys(c1).forEach(function (k) { chiavi[k] = 1; });
        Object.keys(c2).forEach(function (k) { chiavi[k] = 1; });
        var diff = Object.keys(chiavi).map(function (k) {
          return { categoria: k, periodo1: c1[k] || 0, periodo2: c2[k] || 0, delta: finR2((c2[k] || 0) - (c1[k] || 0)) };
        }).sort(function (x, y) { return Math.abs(y.delta) - Math.abs(x.delta); }).slice(0, 8);
        return {
          periodo1: { etichetta: p1.mese == null ? String(p1.anno) : finEtichettaMese(p1.anno, p1.mese), totale: t1, movimenti: l1.length },
          periodo2: { etichetta: p2.mese == null ? String(p2.anno) : finEtichettaMese(p2.anno, p2.mese), totale: t2, movimenti: l2.length },
          delta: finR2(t2 - t1), deltaPercento: t1 > 0 ? finR2((t2 - t1) / t1 * 100) : null,
          categoria: cat2 || "tutte", differenzePerCategoria: diff,
          nota: "Una voce che manca in un periodo compare con lo zero: se sparisse non si vedrebbe la differenza, che e' il dato cercato." };
      }
      case "previsione_spese": {
        var mod2 = finModello(ctx.data, anno, [], ctx.data.cats);
        if (!mod2) return finErr("Nessun dato per l'anno " + anno + ".", ctx.data.anni);
        var serie = mod2.rows.map(function (r) { return r.usciteTot; });
        var p = previsione(serie, 3), tt = totaleConStima(p);
        return { anno: anno, metodo: p.metodo, mediaMensile: p.media,
          mesiStimati: p.stimati.map(function (i) { return FIN_MESI[i]; }),
          gia: tt.reale, stimato: tt.stima, totaleAnno: tt.tot,
          nota: "Il totale tiene separato cio' che e' successo da cio' che e' stimato: mescolarli sarebbe una bugia comoda." };
      }
      case "andamento_conto": {
        var mod3 = finModello(ctx.data, anno, [], ctx.data.cats);
        if (!mod3) return finErr("Nessun dato per l'anno " + anno + ".", ctx.data.anni);
        var l = letturaConto(mod3.rows, ctx.soglia);
        return { anno: anno, soglia: ctx.soglia,
          perMese: mod3.rows.map(function (r) { return { mese: FIN_MESI[r.i], contoPrevisto: finR2(r.projectedCC) }; }),
          puntoPiuBasso: l.min ? { mese: FIN_MESI[l.min.i], valore: finR2(l.min.v) } : null,
          puntoPiuAlto: l.max ? { mese: FIN_MESI[l.max.i], valore: finR2(l.max.v) } : null,
          mesiSottoSoglia: l.sotto, mesiSottoZero: l.negativi,
          nota: "Proiezione con le entrate previste: e' una previsione, non un estratto conto." };
      }
      case "ripartizione": {
        var mod4 = finModello(ctx.data, anno, [], ctx.data.cats);
        if (!mod4) return finErr("Nessun dato per l'anno " + anno + ".", ctx.data.anni);
        var righe = mese == null ? mod4.rows : [mod4.rows[mese]];
        var q = perQuadrante(righe);
        return { periodo: mese == null ? String(anno) : finEtichettaMese(anno, mese), totale: q.tot,
          necessarie: { importo: q.necessarie.v, quota: finR2(q.necessarie.quota * 100) },
          vita: { importo: q.vita.v, quota: finR2(q.vita.quota * 100) },
          fisse: { importo: q.fisse.v, quota: finR2(q.fisse.quota * 100) },
          variabili: { importo: q.variabili.v, quota: finR2(q.variabili.quota * 100) },
          nota: "Due assi indipendenti: necessaria/vita risponde a 'posso farne a meno', fissa/variabile a 'l'importo e' sempre uguale'." };
      }
      case "elenco_categorie": {
        var cb = ctx.data.catBase || {}, cts = ctx.data.cats || {}, ct = ctx.data.catTipo || {};
        return { categorie: Object.keys(cts).sort().map(function (c) {
            return { nome: c, necessita: cts[c], importo: ct[c] || "VARIABILE", mista: !!(cb[c] && cb[c].misto) };
          }), daDecidere: ctx.data.daDecidere || [],
          nota: "Le categorie 'da decidere' valgono vita finche' non le scegli in Impostazioni." };
      }
      case "spese_ricorrenti": {
        var ric = finRicorrenti(ctx, a.anno != null ? anno : null);
        var alMese = 0;
        ric.forEach(function (r) { alMese += r.importo; });
        return { periodo: a.anno != null ? String(anno) : "tutti gli anni", quante: ric.length,
          pesoAlMese: finR2(alMese), voci: ric.slice(0, 20),
          nota: "Riconosciute come ricorrenti le spese con stessa categoria e stesso importo in almeno 3 mesi diversi. E' una lettura dei dati, non una colonna del foglio." };
      }
      case "da_pagare": {
        var mi2 = mese == null ? finM(oggi) : mese;
        var dp = finFiltra(ctx, { anno: anno, mese: mi2, soloDaPagare: true });
        var carta = dp.filter(function (m) { return m.cc; });
        return { periodo: finEtichettaMese(anno, mi2), quante: dp.length, totale: finTot(dp),
          suCarta: finTot(carta),
          voci: dp.sort(function (x, y) { return y.amount - x.amount; }).slice(0, 20).map(function (m) {
            return { categoria: m.cat, importo: finR2(m.amount), nota: m.note, data: m.dateISO, carta: !!m.cc };
          }) };
      }
      case "top_spese": {
        var ts = finFiltra(ctx, { anno: anno, mese: mese });
        return { periodo: mese == null ? String(anno) : finEtichettaMese(anno, mese),
          spese: ts.sort(function (x, y) { return y.amount - x.amount; }).slice(0, a.limite || 10).map(function (m) {
            return { data: m.dateISO || finEtichettaMese(m.y, m.m), categoria: m.cat, importo: finR2(m.amount), nota: m.note };
          }) };
      }
      case "entrate": {
        var b = ctx.data.base && ctx.data.base[anno];
        if (!b) return finErr("Nessun dato per l'anno " + anno + ".", ctx.data.anni);
        var tot = 0, inc = 0;
        var perM = b.entrate.map(function (v, i) {
          var i2 = (b.entrateIn || [])[i] || 0;
          tot += v; inc += i2;
          return { mese: FIN_MESI[i], previste: finR2(v), incassate: finR2(i2), attese: finR2(Math.max(0, v - i2)) };
        });
        return { anno: anno, totalePreviste: finR2(tot), totaleIncassate: finR2(inc), perMese: perM,
          nota: "Previste e incassate sono due serie diverse: la prima proietta il futuro, la seconda compone il saldo di adesso." };
      }
      case "quanto_posso_spendere": {
        var mi3 = mese == null ? finM(oggi) : mese;
        var mg = finMargine(ctx, anno, mi3);
        return mg.errore ? finErr(mg.errore, ctx.data.anni) : mg;
      }
      case "dove_tagliare":
        return finDoveTagliare(ctx, anno);
      case "anomalie":
        return finAnomalie(ctx, anno, mese);
      case "segna_pagata": {
        var pz = finAzStato(ctx, Object.assign({}, a, { anno: a.anno != null ? anno : null, mese: mese }));
        if (pz.errore) return finErr(pz.errore, pz.valoriDisponibili);
        return { proposta: pz, scritta: false,
          nota: "NON ho scritto niente: " + pz.nRighe + (pz.nRighe === 1 ? " riga proposta" : " righe proposte") + ", scrivono solo se l'utente conferma." };
      }
      case "modifica_spesa": {
        var pm = finAzModifica(ctx, Object.assign({}, a, { anno: a.anno != null ? anno : null, mese: mese }));
        if (pm.errore) { var e1 = finErr(pm.errore, pm.valoriDisponibili); if (pm.candidati) e1.candidati = pm.candidati; return e1; }
        return { proposta: pm, scritta: false, nota: "NON ho scritto niente: la modifica parte solo dalla conferma." };
      }
      case "elimina_spesa": {
        var pe = finAzElimina(ctx, Object.assign({}, a, { anno: a.anno != null ? anno : null, mese: mese }));
        if (pe.errore) { var e2 = finErr(pe.errore, pe.valoriDisponibili); if (pe.candidati) e2.candidati = pe.candidati; return e2; }
        return { proposta: pe, scritta: false, nota: "NON ho eliminato niente: serve la conferma, che qui e' doppia." };
      }
      case "imposta_necessita": {
        var pn = finAzNecessita(ctx, a);
        if (pn.errore) return finErr(pn.errore, pn.valoriDisponibili);
        return { proposta: pn, scritta: false, nota: "NON ho cambiato niente: serve la conferma." };
      }
      case "registra_spesa": {
        var pr = finProposta("spesa", { importo: a.importo, categoria: a.categoria, data: a.data,
          nota: a.nota, pagamento: a.pagamento, tipo: a.tipo }, ctx);
        if (pr.mancanti.length) return finErr("Mancano: " + pr.mancanti.join(", ") + ".", pr.mancanti.indexOf("categoria") >= 0 ? cats : null);
        return { proposta: pr, scritta: false,
          nota: "NON ho scritto niente: questa e' una proposta. L'utente vede la riga e conferma con un pulsante." };
      }
      case "spesa_ricorrente": {
        var da = (a.daAnno != null || a.daMese != null)
          ? { y: a.daAnno != null ? Math.round(a.daAnno) : finY(oggi), m: a.daMese != null ? Math.round(a.daMese) : finM(oggi) } : null;
        var fine = null;
        if (a.aAnno != null || a.aMese != null) {
          fine = { y: a.aAnno != null ? Math.round(a.aAnno) : (da ? da.y : finY(oggi)), m: a.aMese != null ? Math.round(a.aMese) : 11 };
        } else if (a.mesi != null && a.mesi > 0) {
          var d0 = da || { y: finY(oggi), m: finM(oggi) };
          var tt2 = d0.y * 12 + d0.m + Math.round(a.mesi) - 1;
          fine = { y: Math.floor(tt2 / 12), m: tt2 % 12 };
        }
        var pr2 = finProposta("ricorrente", { importo: a.importo, categoria: a.categoria, nota: a.nota,
          pagamento: a.pagamento, tipo: a.tipo, giorno: a.giorno, da: da, a: fine }, ctx);
        if (pr2.mancanti.length) return finErr("Mancano: " + pr2.mancanti.join(", ") + ".", pr2.mancanti.indexOf("categoria") >= 0 ? cats : null);
        if (pr2.errore) return finErr(pr2.errore);
        return { proposta: pr2, scritta: false,
          nota: "NON ho scritto niente: sono " + pr2.nRighe + " righe proposte. Scrivono solo se l'utente conferma." };
      }
      default:
        return finErr("Strumento sconosciuto: " + nome, finStrumenti().map(function (s) { return s.nome; }));
    }
  } catch (e) {
    return { errore: String(e && e.message ? e.message : e) };
  }
}

/* ---------------- motore locale: risponde senza modello ----------------
   E' quello che rende l'app utile a chiave zero. Copre le domande che si
   fanno tutti i giorni e le due azioni; quando non sa, torna null e lascia
   la parola al modello (se c'e'). Non inventa mai: se non sa, lo dice il
   chiamante. */
function finRispondi(domanda, ctx) {
  var t = String(domanda == null ? "" : domanda).trim();
  if (!t || !ctx || !ctx.data || !ctx.data.anni) return null;
  var n = finNorm(t);
  var lettura = finInterpreta(t, ctx);

  /* 1. AZIONI — hanno la precedenza: se stai dettando una spesa, non stai
     facendo una domanda. */
  if (lettura.azione === "pagata") {
    if (!lettura.categoria) {
      return { titolo: "Quale spesa?", testo: "Dimmi quale spesa hai pagato — la categoria basta, per esempio \"ho pagato la bolletta luce\"." };
    }
    var ps = finAzStato(ctx, { categoria: lettura.categoria, pagata: true });
    if (ps.errore) return { titolo: "Non l'ho trovata", testo: ps.errore };
    return {
      titolo: ps.nRighe === 1 ? "Spesa da spuntare" : ps.nRighe + " spese da spuntare",
      testo: "Ho trovato " + ps.nRighe + (ps.nRighe === 1 ? " spesa da pagare" : " spese da pagare") +
        " su " + lettura.categoria + ", per " + finEuro(ps.totale) + ". Le segno pagate?",
      proposta: ps
    };
  }
  if (lettura.azione) {
    var campi = { importo: lettura.importo, categoria: lettura.categoria, nota: lettura.nota,
      pagamento: lettura.pagamento || "conto", tipo: lettura.tipo, data: lettura.data,
      giorno: lettura.giorno, da: lettura.da, a: lettura.a };
    var pr = finProposta(lettura.azione === "ricorrente" ? "ricorrente" : "spesa", campi, ctx);
    if (pr.mancanti.length) {
      return { titolo: "Mi manca un dato", testo: "Per registrarla mi serve ancora: " + pr.mancanti.join(" e ") + ".", proposta: null };
    }
    var titolo = pr.tipo === "ricorrente" ? "Spesa ricorrente da confermare" : "Spesa da confermare";
    var testo = pr.tipo === "ricorrente"
      ? "Ho preparato " + pr.nRighe + (pr.nRighe === 1 ? " rata" : " rate") + " da " + finEuro(pr.campi.importo) +
        " su " + pr.campi.categoria + ", da " + finEtichettaMese(pr.righe[0].y, pr.righe[0].m) +
        " a " + finEtichettaMese(pr.righe[pr.nRighe - 1].y, pr.righe[pr.nRighe - 1].m) +
        ", per un totale di " + finEuro(pr.totale) + "."
      : "Ho preparato una spesa di " + finEuro(pr.campi.importo) + " su " + pr.campi.categoria +
        " il " + pr.righe[0].dataISO + ".";
    return { titolo: titolo, testo: testo, proposta: pr };
  }

  var per = finPeriodo(t, ctx);
  var etichetta = per.mese == null ? String(per.anno) : finEtichettaMese(per.anno, per.mese);

  /* 2. ricorrenti / abbonamenti — PRIMA della domanda generica sulle spese:
     "quali sono le mie spese ricorrenti" contiene "spese" e finirebbe nel
     totale del periodo, che e' un'altra risposta. */
  if (/\b(RICORRENT\w*|ABBONAMENT\w*|OGNI MESE)\b/.test(n)) {
    var rc = finEsegui("spese_ricorrenti", { anno: per.esplicito ? per.anno : null }, ctx);
    if (!rc.quante) return { titolo: "Nessuna ricorrenza", testo: "Non ho trovato spese che tornano con lo stesso importo in almeno 3 mesi." };
    return { titolo: "Spese che tornano ogni mese",
      testo: rc.quante + " voci per " + finEuro(rc.pesoAlMese) + " al mese.",
      tabella: { head: ["Categoria", "Importo €", "Mesi"], rows: rc.voci.map(function (v) { return [v.categoria, v.importo, v.mesiDiversi]; }) },
      nota: rc.nota };
  }

  /* 3. ripartizione necessarie / vita — stesso motivo: "quanto e' necessario"
     e "quanto ho speso" sono due domande diverse. */
  if (/\b(NECESSAR\w*|SUPERFLU\w*|RIPARTIZION\w*|50 30 20)\b/.test(n)) {
    var rp = finEsegui("ripartizione", { anno: per.anno, mese: per.mese }, ctx);
    if (rp.errore) return { titolo: "Non ho i dati", testo: rp.errore };
    return { titolo: "Ripartizione " + rp.periodo, testo: [
      "Necessarie " + finEuro(rp.necessarie.importo) + " (" + rp.necessarie.quota + "%), vita " + finEuro(rp.vita.importo) + " (" + rp.vita.quota + "%).",
      "Fisse " + finEuro(rp.fisse.importo) + ", variabili " + finEuro(rp.variabili.importo) + "."
    ].join("\n") };
  }

  /* 4. "quanto ho speso [in X] [periodo]" */
  if (/\b(QUANTO|QUANTA|QUANTE|TOTALE|SPESO|SPESA|SPESE|USCITE)\b/.test(n) && !/\bRESTA\b|\bSALDO\b|\bCONTO\b|\bENTRAT\w*\b|\bGUADAGN\w*\b/.test(n)) {
    var cat = lettura.categoria;
    var lista = finFiltra(ctx, { anno: per.anno, mese: per.mese, categoria: cat });
    var tot = finTot(lista);
    if (!lista.length) {
      return { titolo: "Nessun movimento", testo: (cat ? "Su " + cat + " n" : "N") + "on ci sono spese in " + etichetta + "." +
        (per.esplicito ? "" : " (periodo non detto: ho guardato " + etichetta + ".)") };
    }
    var top = finEsegui("spese_per_categoria", { anno: per.anno, mese: per.mese, limite: 5 }, ctx);
    var righe = [];
    righe.push((cat ? cat + ": " : "Uscite: ") + finEuro(tot) + " in " + etichetta +
      " su " + lista.length + (lista.length === 1 ? " movimento" : " movimenti") + ".");
    if (!cat && top.categorie && top.categorie.length) {
      righe.push("Le prime: " + top.categorie.slice(0, 3).map(function (c) {
        return c.categoria + " " + finEuro(c.totale);
      }).join(" · ") + ".");
    }
    if (cat && lista.length > 1) righe.push("Media a volta " + finEuro(tot / lista.length) + ".");
    if (!per.esplicito) righe.push("(Periodo non detto: ho guardato " + etichetta + ".)");
    return { titolo: cat ? "Speso in " + cat : "Speso in " + etichetta, testo: righe.join("\n"),
      tabella: !cat && top.categorie ? { head: ["Categoria", "Totale €", "Movimenti"],
        rows: top.categorie.map(function (c) { return [c.categoria, c.totale, c.movimenti]; }) } : null };
  }

  /* 5. saldo / quanto mi resta */
  if (/\b(SALDO|RESTA|RIMANE|RIMASTO|CONTO|DISPONIBIL\w*|IN BANCA)\b/.test(n)) {
    var s = finEsegui("situazione", { anno: per.anno, mese: per.mese == null ? finM(finOggi(ctx)) : per.mese }, ctx);
    if (s.errore) return { titolo: "Non ho i dati", testo: s.errore };
    return { titolo: "Situazione " + s.periodo, testo: [
      "Sul conto adesso: " + finEuro(s.saldoAdesso) + ".",
      "A fine mese, con quello che deve ancora uscire ed entrare: " + finEuro(s.contoAFineMese) +
        (s.sottoSoglia ? " — sotto la soglia di guardia di " + finEuro(s.soglia) + "." : "."),
      "Da pagare: " + finEuro(s.daPagare) + (s.diCuiSuCarta > 0 ? " (di cui " + finEuro(s.diCuiSuCarta) + " sulla carta)" : "") + "."
    ].join("\n") };
  }

  /* 6. cosa devo pagare */
  if (/\b(DA PAGARE|DEVO PAGARE|NON HO PAGATO|SCADENZ\w*|PAGARE)\b/.test(n)) {
    var dp = finEsegui("da_pagare", { anno: per.anno, mese: per.mese == null ? finM(finOggi(ctx)) : per.mese }, ctx);
    if (!dp.quante) return { titolo: "Niente da pagare", testo: "In " + dp.periodo + " non risulta niente da pagare." };
    return { titolo: "Da pagare in " + dp.periodo,
      testo: dp.quante + (dp.quante === 1 ? " voce" : " voci") + " per " + finEuro(dp.totale) +
        (dp.suCarta > 0 ? ", di cui " + finEuro(dp.suCarta) + " sulla carta" : "") + ".",
      tabella: { head: ["Categoria", "Importo €", "Nota"], rows: dp.voci.map(function (v) { return [v.categoria, v.importo, v.nota]; }) } };
  }

  /* 7. entrate */
  if (/\b(ENTRAT\w*|GUADAGN\w*|STIPENDIO|INCASS\w*)\b/.test(n)) {
    var e = finEsegui("entrate", { anno: per.anno }, ctx);
    if (e.errore) return { titolo: "Non ho i dati", testo: e.errore };
    if (per.mese != null) {
      var em = e.perMese[per.mese];
      return { titolo: "Entrate " + etichetta, testo: "Previste " + finEuro(em.previste) + ", incassate " + finEuro(em.incassate) +
        (em.attese > 0 ? ", ancora attese " + finEuro(em.attese) : "") + "." };
    }
    return { titolo: "Entrate " + per.anno, testo: "Previste " + finEuro(e.totalePreviste) + " sull'anno, incassate finora " + finEuro(e.totaleIncassate) + "." };
  }

  /* 8. le spese piu' grandi */
  if (/\b(PIU GRANDI|PIU ALTE|MAGGIORI|TOP|PEGGIOR\w*)\b/.test(n)) {
    var ts = finEsegui("top_spese", { anno: per.anno, mese: per.mese, limite: 8 }, ctx);
    if (!ts.spese.length) return { titolo: "Nessun movimento", testo: "Non ci sono spese in " + etichetta + "." };
    return { titolo: "Spese piu' grandi — " + ts.periodo,
      testo: ts.spese.slice(0, 3).map(function (s2) { return s2.categoria + " " + finEuro(s2.importo); }).join(" · ") + ".",
      tabella: { head: ["Data", "Categoria", "Importo €"], rows: ts.spese.map(function (s2) { return [s2.data, s2.categoria, s2.importo]; }) } };
  }

  return null;
}

/* ---------------- LE ALTRE AZIONI ----------------
   L'app sa fare sette scritture sul foglio; l'assistente ne raggiungeva due
   (spesa singola e ricorrente). Qui arrivano le altre quattro — segnare
   pagata, modificare, eliminare, cambiare la necessita' di una categoria —
   e sono azioni di natura diversa dalle prime: non creano un dato nuovo,
   TOCCANO UNA RIGA CHE ESISTE GIA'.

   Da cui tre regole che valgono solo qui:

   1. LA RIGA VA INDIVIDUATA, NON INDOVINATA. Modifica ed eliminazione
      pretendono UNA riga sola: se la ricerca ne trova piu' d'una, si
      restituisce l'elenco e non si fa niente. Scegliere "la prima" vorrebbe
      dire cambiare un dato a caso.
   2. IL FOGLIO PUO' ESSERE CAMBIATO NEL FRATTEMPO. Ogni azione porta con se'
      categoria e importo attuali: il server li riconfronta con la riga vera
      e rifiuta se non combaciano (e' il lock che c'e' gia' in setStato,
      modificaSpesa ed eliminaSpesa). L'archivio nel telefono e' fermo
      all'ultima sincronizzazione, e su una scrittura la vecchiaia fa danno.
   3. `salvaCategorie` RISCRIVE L'INTERA MAPPA. Mandare solo la categoria
      toccata cancellerebbe tutte le altre scelte gia' fatte: la mappa si
      manda intera, con dentro la modifica. */

/* Movimenti che corrispondono a una descrizione parlata. E' la ricerca che
   sta sotto alle tre azioni su riga. */
function finTrovaMovimenti(ctx, a) {
  var q = a || {};
  var f = { anno: q.anno, mese: q.mese, testo: q.testo || null };
  if (q.categoria) {
    var c = finTrovaCat(q.categoria, finCategorie(ctx), true);
    if (!c) return { errore: "Categoria non trovata.", valoriDisponibili: finCategorie(ctx) };
    f.categoria = c;
  }
  if (q.soloDaPagare) f.soloDaPagare = true;
  var lista = finFiltra(ctx, f);
  if (q.soloPagate) lista = lista.filter(function (m) { return m.paid; });
  if (q.importo != null) {
    var v = finNum(q.importo);
    lista = lista.filter(function (m) { return Math.abs(m.amount - v) < 0.005; });
  }
  /* Le righe senza numero di riga non sono toccabili: sono simulazioni o
     archivi vecchi di un formato precedente. */
  lista = lista.filter(function (m) { return m.row != null; });
  return { movimenti: lista };
}

function finDescriviMov(m) {
  return { riga: m.row, data: m.dateISO || finEtichettaMese(m.y, m.m), categoria: m.cat,
    importo: finR2(m.amount), nota: m.note, pagata: !!m.paid, carta: !!m.cc, tipo: m.tipo };
}

/* Segna pagate (o da pagare) una o piu' spese. E' l'unica delle quattro che
   accetta piu' righe: "segna pagate tutte le bollette" e' una frase sensata,
   "modifica tutte le bollette" no. */
function finAzStato(ctx, a) {
  var pagata = a.pagata !== false;
  var r = finTrovaMovimenti(ctx, { categoria: a.categoria, testo: a.testo, anno: a.anno, mese: a.mese,
    importo: a.importo, soloDaPagare: pagata, soloPagate: !pagata });
  if (r.errore) return r;
  if (!r.movimenti.length) {
    return { errore: "Nessuna spesa " + (pagata ? "da pagare" : "gia' pagata") + " corrisponde a quella descrizione." };
  }
  var righe = r.movimenti.slice(0, 60);
  return {
    tipo: "stato", azione: pagata ? "Segna pagate" : "Rimetti da pagare",
    nRighe: righe.length, totale: finTot(righe),
    troncato: r.movimenti.length > righe.length ? r.movimenti.length : 0,
    righe: righe.map(finDescriviMov),
    avvisi: righe.length > 1 ? ["Sono " + righe.length + " righe: controllale prima di confermare."] : [],
    payload: { items: righe.map(function (m) { return { row: m.row, cat: m.cat, amount: finR2(m.amount) }; }),
      paid: pagata ? 1 : 0 }
  };
}

/* Cambia una spesa esistente. Pretende UNA riga sola. */
function finAzModifica(ctx, a) {
  var r = finTrovaMovimenti(ctx, a);
  if (r.errore) return r;
  if (!r.movimenti.length) return { errore: "Non ho trovato nessuna spesa con quella descrizione." };
  if (r.movimenti.length > 1) {
    return { errore: "La descrizione corrisponde a " + r.movimenti.length + " spese: dimmi quale (data o importo esatto).",
      candidati: r.movimenti.slice(0, 8).map(finDescriviMov) };
  }
  var m = r.movimenti[0], cambi = [];
  var cat = m.cat;
  if (a.nuovaCategoria) {
    var c = finTrovaCat(a.nuovaCategoria, finCategorie(ctx), true) || String(a.nuovaCategoria).toUpperCase().trim();
    if (c !== cat) { cambi.push({ campo: "categoria", da: cat, a: c }); cat = c; }
  }
  var importo = finR2(m.amount);
  if (a.nuovoImporto != null) {
    var v = finNum(a.nuovoImporto);
    if (!(v > 0)) return { errore: "Il nuovo importo non e' un numero valido." };
    if (Math.abs(v - importo) > 0.005) { cambi.push({ campo: "importo", da: importo, a: v }); importo = v; }
  }
  var nota = m.note;
  if (a.nuovaNota != null && String(a.nuovaNota) !== nota) { cambi.push({ campo: "nota", da: nota || "—", a: String(a.nuovaNota) }); nota = String(a.nuovaNota); }
  var data = m.dateISO;
  if (a.nuovaData) {
    var d = finData(a.nuovaData, ctx) || (/^\d{4}-\d{2}-\d{2}$/.test(a.nuovaData) ? a.nuovaData : null);
    if (!d) return { errore: "Non ho capito la nuova data." };
    if (d !== data) { cambi.push({ campo: "data", da: data || "—", a: d }); data = d; }
  }
  var pay = m.cc ? "cc" : "conto";
  if (a.nuovoPagamento === "cc" || a.nuovoPagamento === "conto") {
    if (a.nuovoPagamento !== pay) { cambi.push({ campo: "pagamento", da: pay, a: a.nuovoPagamento }); pay = a.nuovoPagamento; }
  }
  var tipo = m.tipo;
  if (a.nuovoTipo === "FISSA" || a.nuovoTipo === "VARIABILE") {
    if (a.nuovoTipo !== tipo) { cambi.push({ campo: "tipo", da: tipo, a: a.nuovoTipo }); tipo = a.nuovoTipo; }
  }
  if (!cambi.length) return { errore: "Non hai detto cosa cambiare: la spesa resterebbe identica." };

  var avvisi = [];
  /* Cambiare la data puo' spostare la spesa di mese, e il mese e' l'unita'
     di misura di tutta l'app: va detto, non scoperto dopo. */
  var mesePrima = m.m, meseDopo = data ? finM(data) : m.m, annoDopo = data ? finY(data) : m.y;
  if (data && (meseDopo !== mesePrima || annoDopo !== m.y))
    avvisi.push("Cambia mese: da " + finEtichettaMese(m.y, mesePrima) + " a " + finEtichettaMese(annoDopo, meseDopo) + ".");

  return {
    tipo: "modifica", azione: "Modifica la spesa", nRighe: 1, cambi: cambi, avvisi: avvisi,
    righe: [finDescriviMov(m)],
    payload: { row: m.row, oldCat: m.cat, oldAmount: finR2(m.amount),
      date: data, cat: cat, amount: importo, note: nota, pay: pay, tipo: tipo }
  };
}

/* Elimina una spesa. E' l'unica azione che toglie un dato invece di
   aggiungerlo o correggerlo: una riga sola, e la scheda chiede due volte. */
function finAzElimina(ctx, a) {
  var r = finTrovaMovimenti(ctx, a);
  if (r.errore) return r;
  if (!r.movimenti.length) return { errore: "Non ho trovato nessuna spesa con quella descrizione." };
  if (r.movimenti.length > 1) {
    return { errore: "La descrizione corrisponde a " + r.movimenti.length + " spese: per eliminarne una devi dirmi quale (data o importo esatto).",
      candidati: r.movimenti.slice(0, 8).map(finDescriviMov) };
  }
  var m = r.movimenti[0];
  return {
    tipo: "elimina", azione: "Elimina la spesa", nRighe: 1, righe: [finDescriviMov(m)],
    avvisi: ["La riga sparisce dal foglio: non c'e' un annulla."],
    payload: { row: m.row, cat: m.cat, amount: finR2(m.amount) }
  };
}

/* Cambia la necessita' di una categoria (necessaria / vita). Non tocca
   nessuna riga, ma cambia come vengono LETTE tutte quelle di quella
   categoria: ripartizione, "dove tagliare", i quattro quadranti. */
function finAzNecessita(ctx, a) {
  var nec = String(a.necessita || "").toLowerCase();
  if (nec !== "necessaria" && nec !== "vita")
    return { errore: "La necessita' puo' essere solo 'necessaria' oppure 'vita'.", valoriDisponibili: ["necessaria", "vita"] };
  var cats = finCategorie(ctx);
  var cat = finTrovaCat(a.categoria, cats, true);
  if (!cat) return { errore: "Categoria non trovata.", valoriDisponibili: cats };
  var prima = (ctx.data.cats || {})[cat] || "vita";
  if (prima === nec) return { errore: cat + " e' gia' classificata come " + nec + "." };

  /* LA MAPPA SI MANDA INTERA. `salvaCategorie` riscrive la proprieta' da
     zero: mandare solo questa categoria cancellerebbe tutte le altre
     scelte gia' fatte. */
  var mappa = {};
  var cfg = ctx.data.catCfg || {};
  for (var k in cfg) if (cfg.hasOwnProperty(k) && cfg[k] && cfg[k].nec) mappa[k] = { nec: cfg[k].nec };
  mappa[cat] = { nec: nec };

  var quante = finFiltra(ctx, { categoria: cat }).length;
  return {
    tipo: "necessita", azione: "Riclassifica la categoria", nRighe: 0,
    cambi: [{ campo: cat, da: prima, a: nec }],
    avvisi: ["Cambia la lettura di " + quante + (quante === 1 ? " movimento" : " movimenti") +
      " gia' registrati: nessuna riga viene toccata, cambia come vengono contati.",
      "Le altre " + Object.keys(mappa).length + " scelte gia' fatte restano: la mappa viene mandata intera."],
    payload: { categorie: mappa }
  };
}

/* ---------------- ANALISI CHE RISPONDONO A UNA DECISIONE ----------------
   Le altre dicono com'e' andata. Queste tre rispondono a "e adesso?". */

/* Quanto posso ancora spendere questo mese senza scendere sotto la soglia
   di guardia. E' la domanda che uno si fa davvero prima di comprare. */
function finMargine(ctx, anno, mese) {
  var mod = finModello(ctx.data, anno, [], ctx.data.cats);
  if (!mod) return { errore: "Nessun dato per l'anno " + anno + "." };
  var r = mod.rows[mese];
  var margine = r.projectedCC - ctx.soglia;
  var giorni = new Date(Date.UTC(anno, mese + 1, 0)).getUTCDate();
  var oggi = finOggi(ctx);
  var giorniRimasti = (finY(oggi) === anno && finM(oggi) === mese) ? Math.max(0, giorni - finG(oggi)) : giorni;
  return {
    periodo: finEtichettaMese(anno, mese), soglia: ctx.soglia,
    contoPrevistoAFineMese: finR2(r.projectedCC),
    margineSullaSoglia: finR2(margine),
    puoiAncoraSpendere: finR2(Math.max(0, margine)),
    alGiorno: giorniRimasti > 0 ? finR2(Math.max(0, margine) / giorniRimasti) : null,
    giorniRimasti: giorniRimasti,
    giaSpeso: finR2(r.usciteTot), daPagare: finR2(r.dueTot), entrateAttese: finR2(r.entrateAtt),
    sottoSoglia: margine < 0,
    nota: "Il margine e' sul CONTO PREVISTO a fine mese (entrate previste comprese), non sul saldo di adesso. Sotto zero vuol dire che il mese si chiude sotto la soglia di guardia anche senza spendere altro."
  };
}

/* Dove si taglia: le categorie "vita" che pesano di piu'. Non e' una
   classifica del male — e' l'elenco delle voci su cui una decisione e'
   possibile, con quanto costano al mese. */
function finDoveTagliare(ctx, anno) {
  var lista = finFiltra(ctx, { anno: anno, necessita: "vita" });
  if (!lista.length) return { anno: anno, voci: [], nota: "Nessuna spesa classificata come \"vita\" nel periodo." };
  var mappa = {};
  lista.forEach(function (m) {
    if (!mappa[m.cat]) mappa[m.cat] = { categoria: m.cat, totale: 0, n: 0, mesi: {} };
    mappa[m.cat].totale += m.amount; mappa[m.cat].n++; mappa[m.cat].mesi[m.m] = 1;
  });
  var tot = finTot(lista);
  var voci = Object.keys(mappa).map(function (k) {
    var v = mappa[k], nMesi = Object.keys(v.mesi).length || 1;
    return { categoria: v.categoria, totale: finR2(v.totale), movimenti: v.n, mesiCoinvolti: nMesi,
      alMese: finR2(v.totale / nMesi), quotaSullaVita: finR2(v.totale / tot * 100) };
  }).sort(function (a, b) { return b.totale - a.totale; });
  return {
    anno: anno, totaleVita: tot, voci: voci,
    nota: "Solo le categorie classificate \"vita\": sono quelle di cui si puo' fare a meno per definizione. La media e' sui mesi in cui la spesa c'e' stata davvero."
  };
}

/* Movimenti fuori scala rispetto alla LORO categoria. Si usa la mediana e
   non la media: con la media, una sola spesa enorme alza il riferimento e
   si nasconde da sola. */
function finAnomalie(ctx, anno, mese) {
  var tutti = finFiltra(ctx, { anno: anno });
  var perCat = {};
  tutti.forEach(function (m) { (perCat[m.cat] = perCat[m.cat] || []).push(m.amount); });
  var esame = mese == null ? tutti : tutti.filter(function (m) { return m.m === mese; });
  var fuori = [];
  esame.forEach(function (m) {
    var serie = perCat[m.cat] || [];
    if (serie.length < 4) return;              // troppo poca storia per dire "strano"
    /* La spesa in esame NON entra nel riferimento con cui viene giudicata:
       altrimenti si alza da sola la mediana e si difende. Su quattro
       movimenti con un picco da 900 la differenza e' fra 225 e 200, cioe'
       fra "3,5 volte" e "4,5 volte" — e la soglia sta li' in mezzo. */
    var altri = serie.slice(), via = altri.indexOf(m.amount);
    if (via >= 0) altri.splice(via, 1);
    if (altri.length < 3) return;
    var ord = altri.sort(function (a, b) { return a - b; });
    var mid = Math.floor(ord.length / 2);
    var mediana = ord.length % 2 ? ord[mid] : (ord[mid - 1] + ord[mid]) / 2;
    if (mediana <= 0) return;
    var volte = m.amount / mediana;
    if (volte >= 2.5 && m.amount - mediana >= 30) {
      fuori.push({ data: m.dateISO || finEtichettaMese(m.y, m.m), categoria: m.cat, importo: finR2(m.amount),
        nota: m.note, medianaCategoria: finR2(mediana), volteLaMediana: finR2(volte) });
    }
  });
  fuori.sort(function (a, b) { return b.volteLaMediana - a.volteLaMediana; });
  return {
    periodo: mese == null ? String(anno) : finEtichettaMese(anno, mese),
    quante: fuori.length, movimenti: fuori.slice(0, 15),
    nota: "Fuori scala = almeno 2,5 volte la MEDIANA DELLE ALTRE spese della sua categoria (la spesa in esame non entra nel proprio riferimento) e almeno 30 € sopra, su categorie con almeno 4 movimenti. La mediana e non la media: con la media una spesa enorme alza il riferimento e si nasconde da sola. Non e' un errore, e' qualcosa da guardare."
  };
}

/* ---------------- DETTATURA ----------------
   Il riconoscimento vocale del browser consegna una frase, non un dato: qui
   la si porta nella forma che l'interprete sa leggere. Due cose sbagliano
   quasi sempre, e sono proprio le due che contano su una spesa:

     "venti virgola cinquanta euro"  ->  "20,50 euro"

   Il resto della frase NON si tocca: quello che compare in chat dev'essere
   quello che hai detto, altrimenti non si capisce piu' perche' l'app abbia
   capito una cosa invece di un'altra. */

var FIN_VOCE_LINGUA = "it-IT";

/* La via che funziona SEMPRE, perche' non dipende dalla pagina: il tasto
   microfono della tastiera del telefono scrive nel campo come se stessi
   digitando. E' il ripiego da nominare ogni volta che il microfono in
   pagina non parte. */
var FIN_VOCE_RIPIEGO = "Intanto puoi usare il tasto microfono della tastiera del telefono: detta li' dentro e poi invii.";
var FIN_VOCE_ASSENTE = "Questo browser non ha il riconoscimento vocale. " + FIN_VOCE_RIPIEGO;

/* ── SU IPHONE IL MICROFONO DELLA PAGINA NON PARTIRA' MAI ────────────────
   Non e' una configurazione da sistemare: l'app vive dentro la cornice di
   Apps Script, che non delega il microfono a chi ci sta dentro, e su iOS
   TUTTI i browser sono WebKit — cambiare browser non cambia niente.
   Un pulsante che prova, fallisce e mostra un errore rosso insegna solo che
   l'app e' rotta. Meglio non provare nemmeno e indicare la via che funziona
   sempre: il microfono della TASTIERA, che scrive nel campo come se stessi
   digitando, perche' a dettare e' il telefono e non la pagina. */
var FIN_VOCE_TASTIERA = "Su iPhone la dettatura si fa con il microfono della TASTIERA, non con questo pulsante: ti ho aperto il campo qui sotto, tocca il 🎙 in basso sulla tastiera e parla. La cornice di Google non concede il microfono alla pagina, e nessuna impostazione del telefono lo sblocca.";

/* ============================================================
   LE CONVERSAZIONI SONO UN ELENCO, NON UNA SOLA
   Con una chat sola, "Nuova" cancellava: l'unico modo di cambiare
   argomento era buttare via quello di prima. Qui una conversazione si
   METTE DA PARTE e si ritrova — che e' anche l'unico modo perche' la
   memoria del modello (gli ultimi turni) resti attaccata all'argomento
   giusto invece di mescolare la spesa di ieri con l'analisi di oggi.
   Tutto quello che segue e' senza React e senza browser: la logica delle
   chat si prova in Node come il resto del motore.
   ============================================================ */
var FIN_MAX_CHAT = 30;
var FIN_TIT_MAX = 42;

/* Il titolo e' la PRIMA domanda, non l'ultima: e' quella che dice di cosa
   si parlava, e non cambia sotto gli occhi mentre la conversazione va
   avanti. */
function finChatTitolo(msgs) {
  var lista = msgs || [];
  for (var i = 0; i < lista.length; i++) {
    if (lista[i] && lista[i].role === "user" && String(lista[i].text || "").trim()) {
      var t = String(lista[i].text).replace(/\s+/g, " ").trim();
      return t.length > FIN_TIT_MAX ? t.slice(0, FIN_TIT_MAX - 1).trim() + "…" : t;
    }
  }
  return "";
}

/* Le piu' recenti in testa, e oltre FIN_MAX_CHAT le piu' vecchie cadono.
   Ordine stabile a parita' di data: due chat aperte nello stesso istante
   non devono ballare a ogni render. */
function finChatOrdina(chats) {
  var out = (chats || []).slice();
  out.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
  return out.slice(0, FIN_MAX_CHAT);
}

/* Scrivere nella chat ATTIVA, che arriva come parametro e non si rilegge
   da nessuno stato: una domanda produce piu' scritture (la domanda, poi
   ogni passaggio del ciclo agentico) e le successive arrivano da callback
   che hanno in mano il valore di un render precedente. Rileggendolo li',
   ogni passaggio si inventerebbe una conversazione nuova. */
function finChatScrivi(chats, id, msgs, ora) {
  var lista = (chats || []).slice();
  var t = ora || 0;
  for (var i = 0; i < lista.length; i++) {
    if (lista[i].id === id) {
      lista[i] = { id: id, ts: t, msgs: msgs, titolo: lista[i].titolo || finChatTitolo(msgs) };
      return finChatOrdina(lista);
    }
  }
  lista.push({ id: id, ts: t, msgs: msgs, titolo: finChatTitolo(msgs) });
  return finChatOrdina(lista);
}

function finChatMsgs(chats, id) {
  var lista = chats || [];
  for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i].msgs || [];
  return [];
}

/* La cronologia vecchia (una conversazione sola, chiave "chat1") NON si
   butta: diventa la prima conversazione dell'elenco. Chi aggiorna l'app
   non deve perdere quello che aveva. */
function finChatMigra(vecchi, ora) {
  if (!vecchi || !vecchi.length) return [];
  return [{ id: ora || 1, ts: ora || 1, msgs: vecchi, titolo: finChatTitolo(vecchi) }];
}

/* Il saluto guarda l'ora, non l'orologio del server: e' l'unica cosa della
   pagina che cambia da sola durante il giorno, e con un "Buongiorno" alle
   undici di sera l'app sembrerebbe non sapere dove si trova. */
function finSaluto(ore) {
  var h = Number(ore);
  if (!isFinite(h)) return "Ciao";
  if (h < 5) return "Buonanotte";
  if (h < 13) return "Buongiorno";
  if (h < 18) return "Buon pomeriggio";
  return "Buonasera";
}

/* Perche' la dettatura DELLA PAGINA non e' utilizzabile qui. Funzione pura:
   l'ambiente arriva come dati, cosi' si prova in Node.
     "assente"  = il browser non ce l'ha proprio
     "tastiera" = c'e' ma la cornice non la concede: si indica la tastiera
     ""         = si puo' provare
   Fuori da iOS non si indovina: si prova, e se il browser dice di no si
   passa alla tastiera da quel momento in poi (`gia` = ha gia' detto di no).
   Disabilitare per prudenza qualcosa che altrove funziona sarebbe togliere
   una funzione a chi ce l'ha. */
function finVoceMotivo(amb) {
  var a = amb || {};
  if (!a.api) return "assente";
  if (a.gia) return "tastiera";
  if (a.ios && a.cornice) return "tastiera";
  return "";
}

/* Vocabolario dei numeri a parole, comprese le forme tronche che l'italiano
   usa nei composti: "ventuno" e' "vent" + "uno", non "venti" + "uno".
   L'ordine di ricerca e' per lunghezza decrescente — e viene calcolato, non
   scritto a mano: con "sessant" prima di "sessanta", "sessantacinque"
   diventerebbe 60 + un avanzo illeggibile. */
var FIN_NUM_PAROLE = [
  ["zero", 0], ["uno", 1], ["una", 1], ["un", 1], ["due", 2], ["tre", 3], ["quattro", 4],
  ["cinque", 5], ["sei", 6], ["sette", 7], ["otto", 8], ["nove", 9], ["dieci", 10],
  ["undici", 11], ["dodici", 12], ["tredici", 13], ["quattordici", 14], ["quindici", 15],
  ["sedici", 16], ["diciassette", 17], ["diciotto", 18], ["diciannove", 19],
  ["venti", 20], ["vent", 20], ["trenta", 30], ["trent", 30], ["quaranta", 40], ["quarant", 40],
  ["cinquanta", 50], ["cinquant", 50], ["sessanta", 60], ["sessant", 60],
  ["settanta", 70], ["settant", 70], ["ottanta", 80], ["ottant", 80], ["novanta", 90], ["novant", 90],
  ["cento", 100], ["mille", 1000], ["mila", 1000]
].sort(function (a, b) { return b[0].length - a[0].length; });

/* Parole che sono numeri SOLO a volte: "una spesa" non e' "1 spesa" e "tu
   sei" non e' "tu 6". Una sequenza fatta solo di queste si converte
   unicamente se subito dopo c'e' la valuta. */
var FIN_NUM_AMBIGUI = { UN: 1, UNA: 1, UNO: 1, SEI: 1 };

/* Un numero italiano scritto a parole, anche tutto attaccato
   ("centocinquanta", "milleduecento"). Torna null se la parola non e'
   fatta INTERAMENTE di numeri: deve consumarla tutta, altrimenti "unico"
   diventerebbe 1 piu' un avanzo buttato via. */
function finNumParola(parola) {
  var t = finNorm(parola);
  if (!t || /[^A-Z]/.test(t)) return null;
  var tot = 0, corrente = 0, visto = false, i = 0;
  while (i < t.length) {
    var trovato = null;
    for (var k = 0; k < FIN_NUM_PAROLE.length; k++) {
      var voce = FIN_NUM_PAROLE[k][0].toUpperCase();
      if (t.substr(i, voce.length) === voce) { trovato = FIN_NUM_PAROLE[k]; i += voce.length; break; }
    }
    if (!trovato) return null;
    visto = true;
    var v = trovato[1];
    if (v === 100) corrente = (corrente || 1) * 100;
    else if (v === 1000) { tot += (corrente || 1) * 1000; corrente = 0; }
    else corrente += v;
  }
  return visto ? tot + corrente : null;
}

/* Il testo dettato, pronto per l'interprete. */
function finVoceTesto(grezzo) {
  var t = String(grezzo == null ? "" : grezzo).replace(/\s+/g, " ").trim();
  if (!t) return "";

  // 1. i numeri a parole diventano cifre
  var pezzi = t.split(" "), out = [], i = 0;
  while (i < pezzi.length) {
    var valori = [], j = i, soloAmbigui = true;
    while (j < pezzi.length) {
      var pulita = pezzi[j].replace(/[.,;:!?]+$/, "");
      var v = finNumParola(pulita);
      if (v === null) break;
      if (!FIN_NUM_AMBIGUI[finNorm(pulita)]) soloAmbigui = false;
      valori.push(v);
      j++;
    }
    if (!valori.length) { out.push(pezzi[i]); i++; continue; }
    var dopo = finNorm(pezzi[j] || "");
    var valuta = dopo === "EURO" || dopo === "EUR" || (pezzi[j] || "").indexOf("€") >= 0;
    if (soloAmbigui && !valuta) { out.push(pezzi[i]); i++; continue; }
    /* Una parola per volta: "venti tre" non e' 23, sono due numeri detti di
       fila, e nessuno detta cosi' un importo. Sommarli sarebbe inventare. */
    for (var q = 0; q < valori.length; q++) {
      var coda = pezzi[i + q].match(/[.,;:!?]+$/);
      out.push(String(valori[q]) + (coda ? coda[0] : ""));
    }
    i = j;
  }
  t = out.join(" ");

  // 2. "20 virgola 50" -> "20,50": e' il modo in cui si detta un importo
  t = t.replace(/(\d)\s*,?\s*virgola\s*,?\s*(\d)/gi, "$1,$2");

  // 3. il punto finale della dettatura non fa parte della frase
  return t.replace(/\s+/g, " ").replace(/[.\s]+$/, "").trim();
}

/* ---------------- VOCE IN USCITA ----------------
   Quello che si legge a schermo e quello che si ascolta non sono la stessa
   cosa. Sullo schermo il markdown aiuta; ad alta voce diventa rumore — gli
   asterischi, i cancelletti e i trattini di elenco vengono pronunciati o
   spezzano la frase. E una tabella da dodici righe, letta, e' una tortura.

   Qui la risposta diventa una frase da dire: niente segni, gli a capo
   diventano pause vere, e i centesimi a zero spariscono ("millecinquecento
   euro" invece di "millecinquecento virgola zero zero euro").

   Si taglia a una frase intera e si dice che il resto e' a schermo: meglio
   una frase in meno che una troncata a meta' parola. */
function finDaLeggere(testo, max) {
  var t = String(testo == null ? "" : testo);
  if (!t.trim()) return "";
  var lim = max || 350;
  t = t.replace(/```[\s\S]*?```/g, " ");        // blocchi di codice: non si leggono
  t = t.replace(/`([^`]+)`/g, "$1");
  t = t.replace(/\*\*([^*]+)\*\*/g, "$1");
  t = t.replace(/^\s*#{1,6}\s+/gm, "");
  t = t.replace(/^\s*[-•*]\s+/gm, "");
  t = t.replace(/^\s*[-—_]{3,}\s*$/gm, " ");
  /* Un a capo non e' una pausa per chi legge ad alta voce: lo diventa se
     si trasforma in un punto. */
  t = t.replace(/\n+/g, ". ");
  t = t.replace(/([.!?:])\s*\.\s*/g, "$1 ");
  // "1.500,00 €" si ascolta meglio senza i centesimi a zero
  t = t.replace(/(\d),00(?!\d)/g, "$1");
  t = t.replace(/\s+/g, " ").trim();
  if (!t) return "";
  if (t.length <= lim) return t;
  var taglio = t.slice(0, lim);
  var fine = Math.max(taglio.lastIndexOf(". "), taglio.lastIndexOf("? "), taglio.lastIndexOf("! "));
  if (fine > lim * 0.4) taglio = taglio.slice(0, fine + 1);
  return taglio.trim() + " Il resto è a schermo.";
}

/* Perche' il microfono non ha funzionato, detto in italiano e con la via
   d'uscita. `aborted` non produce messaggio: l'hai fermato tu. */
function finVoceErrore(codice) {
  var c = String(codice || "");
  if (c === "aborted") return "";
  if (c === "not-allowed" || c === "service-not-allowed")
    return "Microfono bloccato. L'app vive dentro una cornice di Google: il permesso va dato al sito dal lucchetto nella barra degli indirizzi, e su alcune configurazioni la cornice non lo concede affatto. " + FIN_VOCE_RIPIEGO;
  if (c === "no-speech") return "Non ho sentito niente. Tocca il microfono e parla subito dopo.";
  if (c === "audio-capture") return "Nessun microfono disponibile su questo dispositivo.";
  if (c === "network") return "Il riconoscimento vocale passa dai server del browser: senza rete non funziona.";
  return "Dettatura non riuscita" + (c ? " (" + c + ")" : "") + ". " + FIN_VOCE_RIPIEGO;
}

/* ---------------- prompt e richiesta ----------------
   Le regole del dato NON si riscrivono qui a mano: quelle che contano
   arrivano dall'indice (finKB), cioe' dagli stessi dati che alimentano le
   pagine. Nel prompt restano il mestiere e i limiti. */
function finPrompt(ctx) {

  return [
    "Sei l'assistente della app di gestione finanziaria personale di chi ti scrive. Rispondi SEMPRE in italiano, come una persona pratica: diretto, concreto, niente giri di parole e niente prediche sul risparmio.",
    "Oggi e' " + oggi + ".",
    "",
    "COSA SAI FARE:",
    "- CONSULTARE: hai strumenti che leggono i dati veri dell'app. Ogni numero che dici deve venire da uno strumento, mai dalla memoria.",
    "- ANALIZZARE: confronti fra periodi, medie, ricorrenze, previsioni, ripartizione fra necessario e vita.",
    "- AGIRE: registrare una spesa singola o una spesa che si ripete ogni mese.",
    "",
    "COME LAVORI:",
    "- CHIEDI TUTTO IN UNA VOLTA: se ti servono piu' dati, chiama piu' strumenti nello STESSO turno. Ogni giro in piu' e' un'attesa in piu' per chi ti legge (e sul piano gratuito consuma il tetto al minuto).",
    "- Se in coda alla domanda trovi una RISPOSTA GIA' CALCOLATA dall'app, quei numeri sono la verita': commentali, non ricalcolarli e non chiamare strumenti per rifarli.",
    "- L'INDICE ti dice quali categorie, anni e mesi esistono: usalo per passare argomenti validi.",
    "- Se uno strumento risponde con un errore e l'elenco dei valori disponibili, riprova con uno di quelli. Non insistere e non inventare.",
    "",
    "LE AZIONI — LA REGOLA PIU' IMPORTANTE:",
    "1. NESSUNA azione scrive: `registra_spesa`, `spesa_ricorrente`, `segna_pagata`, `modifica_spesa`, `elimina_spesa` e `imposta_necessita` preparano una proposta che l'utente conferma con un pulsante. Non dire mai 'fatto', 'registrata', 'eliminata' o 'salvata': di' che l'hai preparata e che basta confermare.",
    "2. Non chiamarle finche' non hai importo E categoria. Se ne manca una, chiedila in una riga sola.",
    "3. Se l'utente non dice fino a quando deve durare una spesa ricorrente, NON inventare una durata lunga: chiamala lo stesso, l'app assume la fine dell'anno e lo dichiara, e tu ripeti l'assunzione in una riga.",
    "4. La categoria si prende dall'indice. Se quella detta non esiste, dillo e proponi la piu' vicina: una categoria sbagliata sposta la spesa in un posto dove nessuno la cerchera'.",
    "5. Riporta sempre gli avvisi che lo strumento restituisce (importo insolito, possibile doppione, numero di righe): sono il motivo per cui esiste la conferma.",
    "6. MODIFICARE ed ELIMINARE pretendono UNA riga sola. Se lo strumento risponde con `candidati`, la descrizione ne ha trovate piu' d'una: elencagliele in una riga ciascuna e chiedi quale, non sceglierne una tu.",
    "7. \"Ho pagato X\" senza importo NON e' una spesa nuova: e' `segna_pagata` su una spesa che esiste gia'. Con l'importo invece e' una spesa da registrare. Se sbagli, crei un doppione.",
    "8. `elimina_spesa` toglie una riga dal foglio e non c'e' un annulla: proponila solo se te l'hanno chiesto in modo esplicito.",
    "",
    "REGOLE DEL DATO:",
    "- Non inventare numeri, categorie o mesi. Se un dato non c'e', dillo.",
    "- Le spese sulla carta di credito compaiono nel mese SUCCESSIVO con addebito il 15: quando parli di un mese, ricordalo se cambia la risposta.",
    "- Entrate previste ed entrate incassate sono due cose diverse: non sommarle e non scambiarle.",
    "- Una previsione e' una previsione: di' sempre con che metodo e' fatta se la usi.",
    "",
    "FORMA: risposte brevi, di norma sotto le 6 righe. Importi con la virgola decimale italiana e il simbolo €. Niente tabelle lunghe: due o tre numeri che servono e basta.",

  ].join("\n");
}

function finRichiesta(messaggi, ctx) {
  return { sistema: finPrompt(ctx), indice: finKB(ctx), messaggi: messaggi, strumenti: finStrumenti() };
}

/* La risposta gia' calcolata dal motore locale viaggia in coda alla domanda:
   il modello la vede come dato certo, non come suggerimento. Cosi' una
   domanda frequente costa zero strumenti e zero attesa. */
function finTurnoUtente(domanda, ctx) {
  var calc = null;
  try { calc = finRispondi(domanda, ctx); } catch (e) { calc = null; }
  var nota = "";
  if (calc && calc.testo) {
    nota = "\n\n[RISPOSTA GIA' CALCOLATA DALL'APP — numeri verificati, non ricalcolarli]\n" + calc.titolo + ": " + calc.testo;
    if (calc.proposta) nota += "\n(L'app ha gia' preparato la proposta e la mostra all'utente con il pulsante di conferma: non ripetere i dettagli, conferma solo che e' pronta e riporta le assunzioni e gli avvisi.)";
  }
  return { ruolo: "user", testo: String(domanda) + nota };
}

/* ============================================================
   LETTURA DELLE BOLLETTE IN PDF
   pdf.js viene scaricato SOLO quando si allega un file: e' circa un mega e
   non deve pesare sull'avvio dell'app, che e' gia' lento per conto suo.
   ============================================================ */
/* Gli URL si scrivono con virgolette normali e concatenazione, NON con i
   template literal. Motivo concreto: un backtick che non arriva integro al
   browser trasforma `https` in un identificatore nudo e il parser risponde
   "Unexpected identifier 'https'. Expected ';' after variable declaration",
   facendo fallire l'INTERO blocco <script> — cioe' l'app che resta sullo
   splash. Per due indirizzi il template literal non dava alcun vantaggio. */
var PDFJS_VER = "3.11.174";
var PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/";
var PDFJS_JS = PDFJS_BASE + PDFJS_VER + "/pdf.min.js";
var PDFJS_WK = PDFJS_BASE + PDFJS_VER + "/pdf.worker.min.js";
let pdfjsAttesa = null;
const caricaPdfJs = () => pdfjsAttesa || (pdfjsAttesa = new Promise((res, rej) => {
  if (window.pdfjsLib) return res(window.pdfjsLib);
  const s = document.createElement("script");
  s.src = PDFJS_JS;
  s.onload = () => {
    if (!window.pdfjsLib) { pdfjsAttesa = null; return rej(new Error("pdf.js caricato ma non disponibile.")); }
    try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WK; } catch (e) {}
    res(window.pdfjsLib);
  };
  s.onerror = () => { pdfjsAttesa = null; rej(new Error("Non riesco a scaricare il lettore PDF (cdnjs.cloudflare.com). Serve la rete.")); };
  document.head.appendChild(s);
}));

// I dati utili stanno nelle prime pagine (riepilogo + scontrino dell'energia).
const testoDaPdf = async (file, maxPag = 4) => {
  const lib = await caricaPdfJs();
  const buf = await file.arrayBuffer();
  const doc = await lib.getDocument({ data: new Uint8Array(buf) }).promise;
  const pezzi = [];
  for (let i = 1; i <= Math.min(doc.numPages, maxPag); i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    pezzi.push(tc.items.map(it => it.str).join(" "));
  }
  try { doc.destroy(); } catch (e) {}
  return pezzi.join(" \n ");
};

/* BOLLETTE:PARSER:START — blocco SENZA JSX e senza dipendenze dal DOM per
   contratto: finanze/smoke_bollette.js lo estrae e lo esegue in Node contro
   le bollette vere. Se qui dentro entra del React, il test non gira piu'. */
/* Niente `??` qui dentro: e' ES2020 e su Safari sotto iOS 13.4 e' un ERRORE
   DI SINTASSI, che fa fallire l'intero blocco <script> — lo stesso guasto
   che teneva l'app ferma sul caricamento. `primo` fa la stessa cosa. */
const primo = (a, b) => (a === undefined || a === null) ? b : a;
const nPdf = s => { if (s == null) return undefined; const n = parseFloat(String(s).replace(/\./g, "").replace(",", ".")); return isFinite(n) ? Math.round(n * 100) / 100 : undefined; };
const cerca1 = (t, re) => { const m = t.match(re); return m ? m[1] : null; };

/* Il testo si appiattisce a spazi singoli: pdf.js non garantisce gli a capo
   e le stesse voci vanno riconosciute comunque. */
function parseBolletta(testoGrezzo) {
  const t = String(testoGrezzo || "").replace(/ /g, " ").replace(/\s+/g, " ").trim();
  const esito = { campi: {}, avvisi: [], testoLen: t.length };

  const luce = /BOLLETTA\s+LUCE/i.test(t), gas = /BOLLETTA\s+GAS/i.test(t);
  if (!luce && !gas) { esito.errore = "Non riconosco questa bolletta: manca l'intestazione BOLLETTA LUCE / BOLLETTA GAS."; return esito; }
  if (luce && gas) { esito.errore = "Il file contiene sia luce sia gas: allegali separati."; return esito; }
  esito.tipo = luce ? "luce" : "gas";

  const mm = t.match(/La tua bolletta di\s+([A-Za-zàèéìòù]+)\s+(\d{4})/i);
  if (mm) {
    const i = MESI_LONG.findIndex(x => x.toLowerCase() === mm[1].toLowerCase());
    if (i >= 0) { esito.meseCons = i; esito.annoCons = parseInt(mm[2], 10); }
  }
  if (esito.meseCons == null) esito.avvisi.push("Mese di consumo non trovato: scegliilo a mano.");

  // Il foglio usa "mese pagamento = mese di consumo + 1" su tutte le righe
  // gia' compilate: si propone quello, e accanto si mostra la scadenza vera.
  if (esito.meseCons != null) {
    esito.mesePag = (esito.meseCons + 1) % 12;
    esito.annoPag = esito.annoCons + (esito.meseCons === 11 ? 1 : 0);
  }
  esito.scadenza = cerca1(t, /Entro il\s+(\d{2}\/\d{2}\/\d{4})/i);
  esito.fornitore = /Octopus/i.test(t) ? "OCTOPUS" : (/Pulsee/i.test(t) ? "PULSEE" : null);
  if (!esito.fornitore) esito.avvisi.push("Fornitore non riconosciuto dal testo.");

  const tot = primo(nPdf(cerca1(t, /TOTALE DA PAGARE\s+([\d.,]+)\s*€/i)),
                    nPdf(cerca1(t, /dovrai pagare\s+([\d.,]+)\s*€/i)));

  if (luce) {
    esito.campi.tot = tot;
    esito.campi.qFissa = nPdf(cerca1(t, /Quota fissa\s+1 mese x\s+[\d.,]+\s*€\/mese\s+([\d.,]+)\s*€/i));
    esito.campi.qPot = nPdf(cerca1(t, /Quota potenza\s+[\d.,]+\s*kW x\s+[\d.,]+\s*€\/kW\s+([\d.,]+)\s*€/i));
    esito.campi.accise = nPdf(cerca1(t, /Accise e IVA\s+([\d.,]+)\s*€/i));
    esito.campi.rai = nPdf(cerca1(t, /televisione per uso privato\s+([\d.,]+)\s*€/i)) || 0;
    esito.campi.kwh = primo(nPdf(cerca1(t, /Quota per consumi\s+([\d.,]+)\s*kWh x/i)),
                            nPdf(cerca1(t, /CONSUMO FATTURATO:\s*([\d.,]+)\s*kWh/i)));
    /* Sconti e conguagli ("Altre partite"): il foglio non ha una colonna per
       loro, quindi finiscono dentro la materia prima, che e' calcolata per
       differenza. Non e' un errore, ma va DETTO: altrimenti il prezzo al kWh
       di quel mese sembra sbagliato senza motivo. */
    esito.campi.altre = nPdf(cerca1(t, /Altre partite[^€]{0,60}?(-?[\d.,]+)\s*€/i));

    // Controllo di coerenza sulla somma dello scontrino: se non torna, il
    // testo e' stato letto male e va detto PRIMA di scrivere sul foglio.
    const c = esito.campi;
    if (c.tot != null && c.qFissa != null && c.qPot != null && c.accise != null) {
      const consumi = Math.round((c.tot - c.qFissa - c.qPot - c.accise - (c.rai || 0) - (c.altre || 0)) * 100) / 100;
      esito.materiaPrima = consumi;
      const atteso = nPdf(cerca1(t, /Quota per consumi\s+[\d.,]+\s*kWh x\s+[\d.,]+\s*€\/kWh\s+([\d.,]+)\s*€/i));
      if (atteso != null && Math.abs(atteso - consumi) > 0.02)
        esito.avvisi.push(`Lo scontrino non torna: quota consumi ${eur2(atteso)} contro ${eur2(consumi)} ricavati per differenza. Controlla i valori prima di salvare.`);
      if (c.altre)
        esito.avvisi.push(`Questa bolletta ha una voce "Altre partite" di ${eur2(c.altre)}. Il foglio non ha una colonna per gli sconti: finisce dentro la materia prima, che risultera' di ${eur2(-c.altre)} diversa dallo scontrino.`);
    }
  } else {
    esito.campi.tot = tot;
    esito.campi.smc = primo(nPdf(cerca1(t, /Quota per consumi\s+([\d.,]+)\s*Smc x/i)),
                            nPdf(cerca1(t, /CONSUMO FATTURATO:\s*([\d.,]+)\s*Smc/i)));
    // I costi fissi del gas sono DUE voci: commercializzazione + quota rete.
    const f1 = nPdf(cerca1(t, /Quota fissa \(Commercializzazione\)\s+1 mese x\s+[\d.,]+\s*€\/mese\s+([\d.,]+)\s*€/i));
    const f2 = nPdf(cerca1(t, /Quota fissa\s+\d+\s*gg x\s+[\d.,]+\s*€\/anno\s+([\d.,]+)\s*€/i));
    if (f1 != null || f2 != null) esito.campi.fissi = Math.round(((f1 || 0) + (f2 || 0)) * 100) / 100;
    esito.fissiDettaglio = { commercializzazione: f1, rete: f2 };
  }

  /* `altre` (sconti/conguagli) manca nella maggior parte delle bollette ed e'
     giusto cosi': la sua assenza non e' una voce non letta. */
  const OPZIONALI = { altre: 1 };
  const vuoti = Object.keys(esito.campi).filter(k => esito.campi[k] == null && !OPZIONALI[k]);
  vuoti.forEach(k => { delete esito.campi[k]; }); // mai scrivere sul foglio un valore che non ho letto
  if (vuoti.length) esito.avvisi.push("Voci non trovate nel PDF: " + vuoti.join(", ") + ". Restano vuote, compilale a mano.");
  return esito;
}

/* Etichette e ordine delle voci, per tipo. Il nome e' quello della colonna
   del foglio, cosi' quello che si vede a schermo e quello che viene scritto
   si chiamano allo stesso modo. */
const CAMPI_LUCE = [
  ["tot", "Costo totale bolletta luce", "€"],
  ["kwh", "Consumi", "kWh"],

const ce = React.createElement;

/* Il modello scrive markdown leggero: **grassetto**, `codice`, titoli ###.
   Senza questo, a schermo arrivano gli asterischi. */
function finInline(riga, k) {
  const out = [];
  const re = /(\*\*[^*]+\*\*|`[^`]+`)/g;
  let last = 0, m;
  while ((m = re.exec(riga)) !== null) {
    if (m.index > last) out.push(riga.slice(last, m.index));
    const t = m[0];
    if (t.charAt(0) === "`") out.push(ce("code", { key: k + "c" + m.index, style: { fontFamily: "ui-monospace, monospace", background: C.panel2, borderRadius: 5, padding: "1px 4px", fontSize: "0.92em" } }, t.slice(1, -1)));
    else out.push(ce("b", { key: k + "b" + m.index, style: { color: C.ink } }, t.slice(2, -2)));
    last = m.index + t.length;
  }
  if (last < riga.length) out.push(riga.slice(last));
  return out;
}

            "Scrivo ", ce("b", null, p.nRighe), " righe sul foglio, per ", ce("b", null, eurC(p.totale)), ". Confermi?"),

/* ---- LA SCHEDA DELLE AZIONI SU RIGHE CHE ESISTONO GIA' ----
   Diversa da PropostaCard, e non per capriccio: li' si costruisce un dato
   nuovo e ogni campo si puo' ancora cambiare; qui si TOCCA una riga che
   c'e' gia', e la cosa da mostrare non e' un modulo — e' cosa cambia.
   Prima -> dopo, e le righe esatte che vengono toccate.

function AzioneCard({ iniziale, onScrivi, onRicarica }) {

  if (stato === "fatta") {
    /* Cosa e' successo DAVVERO. Su piu' righe il server puo' averne saltata
       qualcuna (foglio cambiato nel frattempo): si dice, non si arrotonda
       a "fatto". */
    const scritte = esito && esito.scritte != null ? esito.scritte : p.nRighe;
