          : scritte + (scritte === 1 ? " riga aggiornata." : " righe aggiornate.")),
      !!saltate.length && ce("div", { style: { fontSize: 11.5, color: C.amber, marginTop: 6, lineHeight: 1.5 } },
        saltate.length + (saltate.length === 1 ? " riga saltata" : " righe saltate") + ": il foglio e' cambiato da quando l'app l'ha letto (",
        saltate.slice(0, 3).map(x => x.motivo).join(", "), "). Aggiorna e riprova."),
      ce("div", { style: { fontSize: 11, color: C.faint, marginTop: 6 } }, "I numeri qui sopra si aggiornano al prossimo giro."));
  }

  return ce("div", { style: { marginTop: 10, background: C.panel, border: `1px solid ${colore}`, borderRadius: 14, padding: 14 } },
    ce("div", { style: { fontSize: 12.5, fontWeight: 700, color: colore, letterSpacing: .3 } }, p.azione, " — da confermare"),

    !!(p.cambi && p.cambi.length) && ce("div", { style: { marginTop: 10 } },
      ce("div", { style: lbl }, "COSA CAMBIA"),
      p.cambi.map((c, i) => ce("div", { key: i, style: { display: "flex", alignItems: "baseline", gap: 6, fontSize: 12.5, padding: "3px 0" } },
        ce("span", { style: { color: C.faint, minWidth: 74 } }, c.campo),
        ce("span", { style: { color: C.mut, textDecoration: "line-through" } }, typeof c.da === "number" ? eurC(c.da) : String(c.da)),
        ce("span", { style: { color: C.faint } }, "→"),
        ce("span", { style: { color: C.ink, fontWeight: 700 } }, typeof c.a === "number" ? eurC(c.a) : String(c.a))))),

    !!(p.righe && p.righe.length) && ce("div", { style: { marginTop: 10 } },
      ce("div", { style: lbl }, p.tipo === "elimina" ? "RIGA CHE SPARISCE" : p.nRighe === 1 ? "RIGA TOCCATA" : p.nRighe + " RIGHE TOCCATE"),
      ce("div", { style: { maxHeight: 150, overflowY: "auto", WebkitOverflowScrolling: "touch" } }, p.righe.map(riga)),
      p.nRighe > 1 && ce("div", { style: { display: "flex", justifyContent: "space-between", fontSize: 12, marginTop: 6, color: C.mut } },
        ce("span", null, "Totale"), ce("b", { style: { fontFamily: "ui-monospace, monospace", color: C.ink } }, eurC(p.totale))),
      !!p.troncato && ce("div", { style: { fontSize: 10.5, color: C.amber, marginTop: 6 } },
        "Corrispondono " + p.troncato + " righe: ne tocco le prime " + p.nRighe + ".")),

    !!(p.avvisi && p.avvisi.length) && ce("div", { style: { marginTop: 10, background: distruttiva ? "rgba(242,114,109,.12)" : "rgba(233,184,74,.12)", border: `1px solid ${colore}`, borderRadius: 10, padding: "9px 11px" } },
      p.avvisi.map((a, i) => ce("div", { key: i, style: { fontSize: 11.5, color: colore, lineHeight: 1.5 } }, "⚠ ", a))),

    stato === "errore" && ce("div", { style: { marginTop: 10, fontSize: 12, color: C.neg, lineHeight: 1.5 } },
      "Non ha funzionato: ", String(esito)),

    !conferma
      ? ce("button", { onClick: () => (distruttiva || p.nRighe > 1 ? setConferma(true) : scrivi()), disabled: stato === "scrivo",
          style: { marginTop: 14, width: "100%", padding: 15, borderRadius: 12, border: "none", cursor: "pointer",
            fontSize: 14.5, fontWeight: 700, background: distruttiva ? C.neg : C.disp, color: distruttiva ? "#fff" : "#08131C" } },
          stato === "scrivo" ? "Un attimo…" : p.azione)
      : ce("div", { style: { marginTop: 14, background: distruttiva ? "rgba(242,114,109,.1)" : "rgba(233,184,74,.1)", border: `1px solid ${colore}`, borderRadius: 12, padding: 12 } },
          ce("div", { style: { fontSize: 12.5, color: C.ink, lineHeight: 1.5 } },
            distruttiva
              ? ce(React.Fragment, null, "Elimino la riga da ", ce("b", null, eurC(p.righe[0].importo)), " di ", ce("b", null, p.righe[0].categoria), ". Non si torna indietro. Confermi?")
              : ce(React.Fragment, null, "Aggiorno ", ce("b", null, p.nRighe), " righe sul foglio. Confermi?")),
          ce("div", { style: { display: "flex", gap: 8, marginTop: 10 } },
            ce("button", { onClick: () => setConferma(false), style: { flex: 1, padding: 12, borderRadius: 10, border: `1px solid ${C.line}`, background: C.panel2, color: C.mut, fontWeight: 700, cursor: "pointer" } }, "No, lascia stare"),
            ce("button", { onClick: scrivi, disabled: stato === "scrivo",
              style: { flex: 1, padding: 12, borderRadius: 10, border: "none", background: distruttiva ? C.neg : C.disp, color: distruttiva ? "#fff" : "#08131C", fontWeight: 700, cursor: "pointer" } },
              stato === "scrivo" ? "Un attimo…" : distruttiva ? "Sì, elimina" : "Sì, aggiorna"))));
}

/* Quale modello sta rispondendo, e come cambiarlo.
   Serve perche' la scelta automatica sceglie il migliore fra quelli che
   l'account ha davvero, ma "migliore" dipende da cosa si vuole: qualita'
   (pro) o piu' richieste al minuto sul piano gratuito (flash / flash-lite).
   L'elenco arriva dal provider a pannello aperto: e' una chiamata di rete,
   e chi non apre il pannello non deve pagarla. */
function IaConfig({ ia, onConfig, onChiudi }) {
  const [lista, setLista] = useState(null);
  const [busy, setBusy] = useState(true);
  const [err, setErr] = useState("");

  useEffect(() => {
    let vivo = true;
    onConfig("elenco").then(r => {
      if (!vivo) return;
      setBusy(false);
      if (!r || r.error) { setErr((r && r.error) || "elenco non disponibile"); return; }
      setLista(r);
    }).catch(e => { if (vivo) { setBusy(false); setErr(msgErr(e)); } });
    return () => { vivo = false; };
  }, []);

  const cambia = (azione, valore) => {
    setBusy(true);
    onConfig(azione, valore).then(() => { setBusy(false); onChiudi(); }).catch(e => { setBusy(false); setErr(msgErr(e)); });
  };
  const pill = (attivo, testo, onClick) => ce("button", { onClick: onClick, disabled: busy,
    style: { padding: "6px 10px", borderRadius: 16, cursor: "pointer", fontSize: 11.5, fontWeight: 600,
      background: attivo ? C.panel2 : C.panel, color: attivo ? C.ink : C.mut, border: `1px solid ${attivo ? C.disp : C.line}` } }, testo);

  return ce("div", { style: { marginTop: 10, background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, padding: 12 } },
    ce("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "baseline" } },
      ce("div", { style: { fontSize: 12.5, fontWeight: 700, color: C.ink } }, "Modello"),
      ce("button", { onClick: onChiudi, style: { background: "none", border: "none", color: C.mut, fontSize: 12, cursor: "pointer" } }, "Chiudi")),
    ce("div", { style: { fontSize: 11.5, color: C.mut, marginTop: 4 } },
      "In uso: ", ce("span", { style: { fontFamily: "ui-monospace, monospace", color: C.ink } }, ia.modello || "—"),
      ia.automatico ? " (scelto in automatico)" : " (fissato a mano)"),
    ia.nota && ce("div", { style: { fontSize: 10.5, color: C.amber, marginTop: 4, lineHeight: 1.45 } }, ia.nota),

    ce("div", { style: { fontSize: 9.5, letterSpacing: .8, color: C.faint, fontWeight: 600, marginTop: 12 } }, "COSA PREFERISCI"),
    ce("div", { style: { display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap" } },
      [["massima", "Massima"], ["pro", "Qualità"], ["flash", "Equilibrio"], ["flash-lite", "Economia"]].map(([k, t]) =>
        ce("div", { key: k }, pill(ia.preferenza === k, t, () => cambia("preferenza", k))))),
    ce("div", { style: { fontSize: 10.5, color: C.faint, marginTop: 6, lineHeight: 1.45 } },
      ia.preferenza === "massima"
        ? "Parte dal più intelligente che la tua chiave espone e scende di un gradino solo se il provider glielo nega — dicendolo."
        : "Sul piano gratuito il tetto è al minuto: i modelli più leggeri ne concedono di più."),

    busy && ce("div", { style: { fontSize: 12, color: C.mut, marginTop: 10 } }, "◒ un attimo…"),
    !!err && ce("div", { style: { fontSize: 11.5, color: C.neg, marginTop: 10, lineHeight: 1.45 } }, err),
    lista && !!lista.modelli && ce("div", null,
      ce("div", { style: { fontSize: 9.5, letterSpacing: .8, color: C.faint, fontWeight: 600, marginTop: 12 } }, "DISPONIBILI SUL TUO ACCOUNT"),
      ce("div", { style: { display: "flex", flexWrap: "wrap", gap: 6, marginTop: 6, maxHeight: 150, overflowY: "auto" } },
        pill(ia.automatico, "Automatico", () => cambia("modello", "")),
        lista.modelli.slice(0, 12).map(m => ce("div", { key: m.id },
          pill(!ia.automatico && ia.modello === m.id, m.id + (m.preview ? " ·anteprima" : ""), () => cambia("modello", m.id)))))));
}

function ChatFin({ ctx, cats, catTipo, ia, msgs, setMsgs, onChiedi, onScrivi, onRicarica, onConfig,
  chats, chatId, onNuovaChat, onApriChat, onEliminaChat, onRinominaChat }) {
  const [config, setConfig] = useState(false);
  const [q, setQ] = useState("");
  const [busy, setBusy] = useState(false);
  const [cassetto, setCassetto] = useState(false);
  const [rinom, setRinom] = useState(null);   // id della conversazione in rinomina
  const [titTmp, setTitTmp] = useState("");
  const [copiato, setCopiato] = useState(null);
  const [giu, setGiu] = useState(true);       // la lettura e' gia' in fondo?
  const annulla = React.useRef(false);
  const [ascolto, setAscolto] = useState(false);
  const [voceErr, setVoceErr] = useState("");
  const [vocePar, setVocePar] = useState(true);    // rispondere anche a voce
  const [parlando, setParlando] = useState(null);  // id del messaggio in lettura
  const [voceNo, setVoceNo] = useState(false);     // il browser ha gia' detto di no
  const recRef = React.useRef(null);
  const inviaRef = React.useRef(null);
  const inpRef = React.useRef(null);
  const sbloccata = React.useRef(false);

  /* Le tre cose che decidono se la dettatura in pagina si puo' provare.
     Stanno qui e non dentro il motore perche' il motore non tocca il
     browser; la decisione la prende `finVoceMotivo`, che si prova in Node. */
  const motivoVoce = finVoceMotivo({
    api: !!(window.SpeechRecognition || window.webkitSpeechRecognition),
    ios: /iPad|iPhone|iPod/.test(navigator.userAgent || "") ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1),
    cornice: window.top !== window.self,
    gia: voceNo
  });
  const tastiera = motivoVoce === "tastiera";

  /* Si scorre al fondo del DOCUMENTO, non all'ultimo elemento: portando in
     vista solo quello, resterebbe sotto la barra di scrittura. A fondo
     pagina la barra torna al suo posto nel flusso e non copre nulla.

     MA SOLO SE STAI GIA' IN FONDO. Se sei risalito a rileggere una risposta
     di prima, trascinarti in basso a ogni passaggio del ciclo agentico ti
     strappa via la riga che stavi leggendo. Quando non ti segue, compare la
     freccia per tornare giu'. */
  const vicinoFondo = () => {
    try { return (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 140); }
    catch (e) { return true; }
  };
  const inFondo = () => { try { window.scrollTo(0, document.body.scrollHeight); } catch (e) {} setGiu(true); };
  useEffect(() => { if (giu) inFondo(); }, [msgs, busy]);
  useEffect(() => {
    const h = () => setGiu(vicinoFondo());
    try { window.addEventListener("scroll", h, { passive: true }); } catch (e) {}
    return () => { try { window.removeEventListener("scroll", h); } catch (e) {} };
  }, []);

  /* La barra di scrittura cresce col testo fino a un tetto, poi scorre: una
     domanda lunga non deve mangiarsi la conversazione. */
  useEffect(() => {
    const el = inpRef.current;
    if (!el || !el.style) return;
    try { el.style.height = "0px"; el.style.height = Math.min(el.scrollHeight || 0, 132) + "px"; } catch (e) {}
  }, [q]);

  const oggi = ctx.oggi;
  const catVita = Object.keys(cats).filter(c => cats[c] === "vita")[0] || "SVAGO";
  const esempi = [
    "Quanto ho speso a " + MESI_LONG[+oggi.slice(5, 7) - 1] + "?",
    "Cosa devo pagare questo mese?",
    "Quanto mi resta sul conto?",
    "Quali sono le mie spese ricorrenti?",
    "Ogni mese 20 € su " + catVita + " con nota albergo",
    "Confronta questo mese con il mese scorso"
  ];

  /* Ciclo agentico: il modello chiede i dati che gli servono, l'app glieli
     calcola QUI e glieli ridà. Al massimo FIN_GIRI andate e ritorni, così
     una domanda non può girare all'infinito (né consumare il tetto al
     minuto del piano gratuito). */
  const invia = (testo, daVoce, storiaBase) => {
    const dom = String(testo == null ? q : testo).trim();
    if (!dom || busy) return;
    setQ("");
    annulla.current = false;
    setGiu(true);
    let calc = null;
    try { calc = finRispondi(dom, ctx); } catch (e) { calc = null; }
    const id = Date.now();
    const usaIA = !!(ia && ia.disponibile);
    setMsgs(m => [...m, { role: "user", id: id, text: dom },
      { role: "bot", id: id + 1, calc: calc, proposta: calc && calc.proposta ? calc.proposta : null,
        text: usaIA ? "" : (calc ? "" : "Questa non l'ho capita. Prova a dirmela in un altro modo — oppure collega un modello (vedi sotto) e la capisco anche così."),
        pending: usaIA, passi: [] }]);
    /* Senza modello la risposta e' gia' pronta: si legge subito. */
    if (!usaIA) { if (daVoce && vocePar && calc && calc.testo) parla(calc.testo, id + 1); return; }
    setBusy(true);

    const patch = p => setMsgs(m => m.map(x => (x.id === id + 1 ? Object.assign({}, x, typeof p === "function" ? p(x) : p) : x)));
    const chiudi = p => { patch(Object.assign({ pending: false }, p)); setBusy(false); };
    /* Storia: solo i turni visibili, non le tracce degli strumenti.
       `storiaBase` serve a "rigenera": ripetere la domanda con la vecchia
       risposta ancora nella storia otterrebbe la stessa risposta, che e'
       l'unico esito che rende il pulsante inutile. */
    const storia = (storiaBase || msgs).slice(-6).filter(x => (x.role === "user" && x.text) || (x.role === "bot" && x.text))
      .map(x => ({ ruolo: x.role === "user" ? "user" : "model", testo: String(x.text).slice(0, 1200) }));
    const messaggi = [...storia, finTurnoUtente(dom, ctx)];
    let propostaTrovata = calc && calc.proposta ? calc.proposta : null;

    const giro = (n) => {
      if (n > FIN_GIRI) { chiudi({ err: "Troppi passaggi sui dati senza arrivare a una risposta." }); return; }
      onChiedi(finRichiesta(messaggi.slice(), ctx)).then(res => {
        /* Fermato mentre la richiesta era in volo: il messaggio e' gia'
           stato chiuso da `ferma`, e riaprirlo qui farebbe ricomparire una
           risposta che hai chiesto di non aspettare. */
        if (annulla.current) return null;
        if (!res || res.error) { chiudi({ err: (res && res.error) || "risposta vuota" }); return; }
        const chiamate = res.chiamate || [];
        if (!chiamate.length) {
          chiudi({ text: res.testo || "", proposta: propostaTrovata, nota: res.nota || "" });
          if (daVoce && vocePar) parla(res.testo || (calc && calc.testo) || "", id + 1);
          return;
        }
        patch(x => ({ passi: [...(x.passi || []), ...chiamate.map(c => c.nome)] }));
        /* firmaTesto e la firma dentro ogni chiamata tornano indietro come
           sono arrivate: i modelli che ragionano le pretendono nel giro
           successivo, altrimenti rispondono 400. */
        messaggi.push({ ruolo: "model", testo: res.testo || "", firmaTesto: res.firmaTesto || "", chiamate: chiamate });
        const risultati = chiamate.map(c => {
          let out;
          try { out = finEsegui(c.nome, c.argomenti || {}, ctx); }
          catch (e) { out = { errore: msgErr(e) }; }
          /* La proposta intera (righe e payload pronto da scrivere) resta
             qui: al modello va la sintesi. La scheda di conferma la
             disegna l'app, non il modello. */
          if (out && out.proposta) {
            propostaTrovata = out.proposta;
            out = Object.assign({}, out, { proposta: finPropostaSintesi(out.proposta) });
          }
          return { id: c.id, nome: c.nome, contenuto: out };
        });
        patch({ proposta: propostaTrovata });
        messaggi.push({ ruolo: "tool", risultati: risultati });
        giro(n + 1);
      }).catch(e => chiudi({ err: msgErr(e) }));
    };
    try { giro(1); } catch (e) { chiudi({ err: msgErr(e) }); }
  };

  /* FERMA. Un giro agentico puo' consultare sei dati di fila: se hai gia'
     visto quello che ti serve, o se hai sbagliato domanda, aspettare la
     fine e' tempo buttato — e sul piano gratuito e' anche quota bruciata.
     La richiesta in volo non si puo' richiamare indietro: si smette di
     ascoltarla, e lo si dice invece di far finta che non sia partita. */
  const ferma = () => {
    if (!busy) return;
    annulla.current = true;
    setBusy(false);
    zitto();
    setMsgs(m => m.map(x => (x.pending
      ? Object.assign({}, x, { pending: false, nota: "Fermato da te. Quello che avevo gia' letto e' qui sopra." })
      : x)));
  };

  /* RIGENERA e MODIFICA lavorano sulla COPPIA domanda+risposta: la domanda
     dell'utente ha id `n`, la risposta `n+1`. Togliendo solo la risposta
     resterebbe una domanda senza seguito, che nella storia mandata al
     modello sembra una frase lasciata a meta'. */
  const coppiaVia = (idBot, lista) => lista.filter(x => x.id !== idBot && x.id !== idBot - 1);
  const domandaDi = (idBot) => {
    for (var i = 0; i < msgs.length; i++) if (msgs[i].id === idBot - 1) return msgs[i].text || "";
    return "";
  };
  const rigenera = (idBot) => {
    if (busy) return;
    const dom = domandaDi(idBot);
    if (!dom) return;
    const prima = msgs.filter(x => x.id < idBot - 1);
    setMsgs(l => coppiaVia(idBot, l));
    setTimeout(() => invia(dom, false, prima), 0);
  };
  const modifica = (idBot, testo) => {
    if (busy) return;
    setQ(testo);
    setMsgs(l => coppiaVia(idBot, l));
    try { if (inpRef.current) inpRef.current.focus(); } catch (e) {}
  };

  /* Copiare una risposta e' l'unico modo per portarla fuori dall'app (in
     una nota, in un messaggio). `navigator.clipboard` non c'e' ovunque e
     dentro una cornice puo' essere negato: il ripiego con la textarea
     nascosta funziona anche li'. */
  const copia = (testo, id) => {
    const t = String(testo == null ? "" : testo);
    if (!t) return;
    const fatto = () => { setCopiato(id); setTimeout(() => setCopiato(null), 1600); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(fatto).catch(() => {});
        return;
      }
    } catch (e) {}
    try {
      const ta = document.createElement("textarea");
      ta.value = t;
      ta.setAttribute("readonly", "readonly");
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      fatto();
    } catch (e) {}
  };

  /* LA VOCE IN USCITA.
     Legge la risposta solo quando la domanda e' ARRIVATA A VOCE: se hai
     scritto stai guardando lo schermo, e sentirsi leggere quello che si sta
     gia' leggendo e' fastidioso. Per il caso scritto c'e' il pulsante
     "ascolta" sotto ogni risposta.

     Il motore e' quello del telefono (`speechSynthesis`): gratis, funziona
     anche senza rete, e l'audio non esce dal dispositivo — al contrario del
     riconoscimento, che passa dai server del browser. */
  useEffect(() => { stLoad("voce1").then(v => { if (v && typeof v.parla === "boolean") setVocePar(v.parla); }).catch(() => {}); }, []);
  const cambiaVoce = () => { const v = !vocePar; setVocePar(v); if (!v) zitto(); else sbloccaVoce(); stSave("voce1", { parla: v }).catch(() => {}); };

  /* Su iPhone il parlato parte solo se il primo `speak` nasce da un tocco.
     Quello vero arriva dopo, da una callback, e verrebbe ignorato in
     silenzio: qui si "scalda" il motore al primo tocco utile. */
  const sbloccaVoce = () => {
    try {
      if (sbloccata.current || !window.speechSynthesis) return;
      const u = new window.SpeechSynthesisUtterance(" ");
      u.volume = 0; u.lang = FIN_VOCE_LINGUA;
      window.speechSynthesis.speak(u);
      sbloccata.current = true;
    } catch (e) {}
  };
  const zitto = () => { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {} setParlando(null); };
  const parla = (testo, id) => {
    const frase = finDaLeggere(testo);
    if (!frase) return;
    try {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new window.SpeechSynthesisUtterance(frase);
      u.lang = FIN_VOCE_LINGUA;
      u.rate = 1.02;
      u.onend = () => setParlando(null);
      u.onerror = () => setParlando(null);
      setParlando(id == null ? true : id);
      window.speechSynthesis.speak(u);
    } catch (e) { setParlando(null); }
  };
  useEffect(() => () => { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {} }, []);

  /* IL MICROFONO.
     Tocchi, parli, e appena smetti la frase parte da sola: e' l'unico modo
     perche' dettare sia piu' veloce che scrivere. L'invio automatico qui e'
     sicuro per un motivo preciso — dettare non scrive niente sul foglio:
     produce al massimo una PROPOSTA, che resta li' finche' non premi il
     pulsante di conferma. Se ha capito male, lo vedi e annulli.

     Si invia su `onend` e non sul primo risultato definitivo: alcuni
     browser chiudono senza mai marcare "finale", e in quel caso la frase
     resterebbe nel campo senza partire. */
  useEffect(() => { inviaRef.current = invia; });
  useEffect(() => () => { try { if (recRef.current) recRef.current.abort(); } catch (e) {} }, []);

  const microfono = () => {
    if (busy) return;
    /* Se sta parlando, si tace: nessuno vuole che l'assistente si ascolti
       da solo dentro il microfono. */
    zitto();
    sbloccaVoce();
    if (ascolto) { try { if (recRef.current) recRef.current.stop(); } catch (e) {} return; }
    /* Dove la pagina non puo' dettare non si prova nemmeno: si apre il campo
       (su iPhone il tocco fa salire la tastiera, che il microfono ce l'ha) e
       si dice dov'e'. Un tentativo che fallisce ogni volta e' solo un errore
       rosso che insegna a non fidarsi dell'app. */
    if (tastiera) {
      setVoceErr(FIN_VOCE_TASTIERA);
      try { if (inpRef.current) inpRef.current.focus(); } catch (e) {}
      return;
    }
    const Riconoscimento = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Riconoscimento) { setVoceErr(FIN_VOCE_ASSENTE); return; }
    let r;
    try { r = new Riconoscimento(); } catch (e) { setVoceErr(finVoceErrore("")); return; }
    r.lang = FIN_VOCE_LINGUA;
    r.interimResults = true;   // il testo compare mentre parli
    r.continuous = false;      // una frase per volta: poi parte
    r.maxAlternatives = 1;

    let finale = "";
    r.onresult = ev => {
      let parziale = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) finale += t; else parziale += t;
      }
      setQ(finVoceTesto(finale + parziale));
    };
    r.onerror = ev => {
      const c = ev && ev.error;
      const m = finVoceErrore(c);
      if (m) setVoceErr(m);
      /* Detto una volta, vale per sempre: da qui in poi il pulsante manda
         alla tastiera invece di riprovare una strada che il browser ha gia'
         chiuso. Il primo errore resta esteso, perche' spiega il perche'. */
      if (c === "not-allowed" || c === "service-not-allowed") setVoceNo(true);
    };
    r.onend = () => {
      recRef.current = null;
      setAscolto(false);
      const detto = finVoceTesto(finale);
      if (detto) { setQ(""); if (inviaRef.current) inviaRef.current(detto, true); }
    };
    recRef.current = r;
    setVoceErr(""); setQ(""); setAscolto(true);
    try { r.start(); } catch (e) { setAscolto(false); recRef.current = null; setVoceErr(finVoceErrore("")); }
  };

  const motore = ia && ia.disponibile
    ? (ia.provider === "vertex" ? "Vertex AI" : ia.provider === "anthropic" ? "Claude" : "Gemini") + (ia.modello ? " · " + ia.modello : "")
    : "Motore locale";

  const tondo = (attivo) => ({ flex: "0 0 auto", width: 34, height: 34, borderRadius: 17, cursor: "pointer",
    border: `1px solid ${C.line}`, background: "transparent", color: attivo ? C.disp : C.mut,
    fontSize: 15, lineHeight: 1, padding: 0, display: "flex", alignItems: "center", justifyContent: "center" });
  const fantasma = (attivo) => ({ background: "none", border: `1px solid ${C.line}`, borderRadius: 14,
    padding: "3px 10px", color: attivo ? C.disp : C.mut, fontSize: 11, fontWeight: 700, cursor: "pointer" });

  const lista = chats || [];
  const chatAttiva = lista.filter(c => c.id === chatId)[0];
  const titoloPagina = (chatAttiva && chatAttiva.titolo) || (msgs.length ? finChatTitolo(msgs) : "") || "Chiedi ai tuoi conti";

  /* Quando, detto come lo direbbe una persona. Un'ora esatta su una
     conversazione di tre settimane fa non serve a nessuno. */
  const quando = (ts) => {
    try {
      const d = new Date(ts || 0), n = new Date();
      const g = Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
      if (g <= 0) return d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
      if (g === 1) return "ieri";
      if (g < 7) return g + " giorni fa";
      return d.toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" });
    } catch (e) { return ""; }
  };

  const nDomande = (c) => (c.msgs || []).filter(m => m.role === "user").length;
  const apri = (id) => { zitto(); onApriChat(id); setCassetto(false); setGiu(true); };
  const nuova = () => { zitto(); if (onNuovaChat) onNuovaChat(); setCassetto(false); setQ(""); };

  /* Colonna alta quanto lo schermo: senza, con due messaggi la barra di
     scrittura resta appesa a meta' pagina con il vuoto sotto, e l'app
     sembra finita prima di dove finisce davvero. */
  return ce("div", { style: { padding: "0 18px 0", display: "flex", flexDirection: "column", minHeight: "calc(100vh - 200px)" } },

    /* ── IL CASSETTO DELLE CONVERSAZIONI ──────────────────────────────
       "Nuova" prima CANCELLAVA: per cambiare argomento bisognava buttare
       via quello di prima. Qui si mette da parte e si ritrova. */
    cassetto && ce("div", { onClick: () => setCassetto(false),
      style: { position: "fixed", inset: 0, zIndex: 60, background: "rgba(5,10,16,.66)", backdropFilter: "blur(2px)", display: "flex" } },
      ce("div", { className: "fin-cassetto", onClick: e => e.stopPropagation(),
        style: { width: "84%", maxWidth: 320, height: "100%", background: C.panel, borderRight: `1px solid ${C.line}`,
          display: "flex", flexDirection: "column", paddingTop: "env(safe-area-inset-top)" } },
        ce("div", { style: { display: "flex", alignItems: "center", gap: 8, padding: "16px 14px 10px" } },
          ce("div", { style: { fontSize: 13.5, fontWeight: 700, color: C.ink } }, "Conversazioni"),
          ce("div", { style: { marginLeft: "auto", fontSize: 10.5, color: C.faint, fontFamily: "ui-monospace, monospace" } },
            lista.length + "/" + FIN_MAX_CHAT)),
        ce("button", { onClick: nuova,
          style: { margin: "0 12px 8px", padding: "11px 13px", borderRadius: 12, border: `1px solid ${C.disp}`,
            background: "rgba(55,214,160,.08)", color: C.disp, fontSize: 13, fontWeight: 700, cursor: "pointer", textAlign: "left" } },
          "＋  Nuova conversazione"),
        ce("div", { style: { flex: 1, overflowY: "auto", padding: "4px 12px 18px" } },
          !lista.length && ce("div", { style: { fontSize: 11.5, color: C.faint, lineHeight: 1.5, padding: "8px 2px" } },
            "Ancora nessuna conversazione. Le ultime " + FIN_MAX_CHAT + " restano qui, sul telefono."),
          lista.map(c => rinom === c.id
            ? ce("div", { key: c.id, style: { display: "flex", gap: 6, alignItems: "center", marginBottom: 6 } },
                ce("input", { value: titTmp, autoFocus: true, onChange: e => setTitTmp(e.target.value),
                  "aria-label": "Nuovo nome della conversazione",
                  style: { flex: 1, minWidth: 0, background: C.panel2, border: `1px solid ${C.disp}`, borderRadius: 10, padding: "8px 10px", color: C.ink, fontSize: 13, outline: "none" } }),
                ce("button", { onClick: () => { if (titTmp.trim() && onRinominaChat) onRinominaChat(c.id, titTmp.trim()); setRinom(null); },
                  "aria-label": "Salva il nome", style: tondo(true) }, "✓"))
            : ce("div", { key: c.id, style: { display: "flex", gap: 4, alignItems: "center", marginBottom: 4 } },
                ce("button", { onClick: () => apri(c.id),
                  style: { flex: 1, minWidth: 0, textAlign: "left", background: c.id === chatId ? C.panel2 : "transparent",
                    border: `1px solid ${c.id === chatId ? C.disp : "transparent"}`, borderRadius: 10, padding: "9px 10px", cursor: "pointer" } },
                  ce("div", { style: { fontSize: 12.5, color: C.ink, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } },
                    c.titolo || "Senza titolo"),
                  ce("div", { style: { fontSize: 10, color: C.faint, marginTop: 2 } },
                    quando(c.ts) + " · " + nDomande(c) + (nDomande(c) === 1 ? " domanda" : " domande"))),
                ce("button", { onClick: () => { setRinom(c.id); setTitTmp(c.titolo || ""); },
                  "aria-label": "Rinomina la conversazione", title: "Rinomina",
                  style: { background: "none", border: "none", color: C.faint, fontSize: 12, cursor: "pointer", padding: "6px 3px" } }, "✎"),
                ce("button", { onClick: () => onEliminaChat && onEliminaChat(c.id),
                  "aria-label": "Elimina la conversazione", title: "Elimina",
                  style: { background: "none", border: "none", color: C.faint, fontSize: 13, cursor: "pointer", padding: "6px 3px" } }, "✕")))),
        ce("button", { onClick: () => setCassetto(false),
          style: { margin: "0 12px calc(14px + env(safe-area-inset-bottom))", padding: 11, borderRadius: 12, border: `1px solid ${C.line}`, background: C.panel2, color: C.mut, fontSize: 12.5, fontWeight: 700, cursor: "pointer" } },
          "Chiudi"))),

    /* ── TESTATA. Resta in alto mentre la conversazione scorre: il nome di
       chi risponde e il modo di cambiarlo non devono sparire in cima. */
    ce("div", { style: { position: "sticky", top: 0, zIndex: 6, background: C.bg, display: "flex", alignItems: "center", gap: 8, padding: "10px 0 9px", borderBottom: `1px solid ${msgs.length ? C.line : "transparent"}` } },
      ce("button", { onClick: () => setCassetto(true), "aria-label": "Apri le conversazioni", title: "Conversazioni",
        style: tondo(false) }, "☰"),
      ce("div", { style: { flex: 1, minWidth: 0 } },
        ce("div", { style: { fontSize: 14, fontWeight: 700, color: C.ink, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" } },
          titoloPagina),
        /* La pastiglia dice chi sta rispondendo. Con un modello collegato e'
           anche il modo per cambiarlo: nascondere la scelta in un menu la
           renderebbe inesistente. */
        ce(ia && ia.disponibile && onConfig ? "button" : "span", {
          onClick: ia && ia.disponibile && onConfig ? () => setConfig(v => !v) : null,
          style: { display: "inline-block", marginTop: 2, fontSize: 9.5, color: C.faint, background: "none", border: `1px solid ${C.line}`, borderRadius: 20,
            padding: "2px 8px", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", maxWidth: 200,
            cursor: ia && ia.disponibile && onConfig ? "pointer" : "default" } }, motore)),
      ce("button", { onClick: cambiaVoce, title: vocePar ? "Risponde anche a voce" : "Risponde solo a schermo",
        "aria-label": vocePar ? "Disattiva la risposta a voce" : "Attiva la risposta a voce",
        style: Object.assign(tondo(false), { opacity: vocePar ? 1 : .45 }) }, vocePar ? "🔊" : "🔇"),
      ce("button", { onClick: nuova, title: "Nuova conversazione", "aria-label": "Nuova conversazione",
        style: tondo(false) }, "✎")),

    config && ia && ia.disponibile && ce(IaConfig, { ia: ia, onConfig: onConfig, onChiudi: () => setConfig(false) }),

    !msgs.length && ce("div", { className: "fin-sale" },
      ce("div", { style: { fontSize: 27, fontWeight: 700, marginTop: 26, lineHeight: 1.2,
        background: `linear-gradient(90deg, ${C.disp} 0%, #5AC8FA 90%)`, WebkitBackgroundClip: "text", backgroundClip: "text",
        WebkitTextFillColor: "transparent", color: C.disp } }, finSaluto(new Date().getHours())),
      ce("div", { style: { fontSize: 15, color: C.mut, marginTop: 6, lineHeight: 1.5 } }, "Come vanno i conti?"),
      ce("div", { style: { fontSize: 12.5, color: C.faint, marginTop: 12, lineHeight: 1.55 } },
        "Chiedimi quanto hai speso, cosa resta da pagare o come stai andando. ",
        "Oppure dettami una spesa: ", ce("b", { style: { color: C.mut } }, "\"ogni mese 20 € su vacanza con nota albergo\""),
        " — la preparo e tu confermi."),
      /* Le prime quattro come schede, le altre come pastiglie: le schede si
         leggono a colpo d'occhio, le pastiglie non rubano mezza schermata. */
      ce("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 16 } },
        esempi.slice(0, 4).map((e, i) => ce("button", { key: i, onClick: () => invia(e),
          style: { textAlign: "left", background: C.panel, border: `1px solid ${C.line}`, borderRadius: 14, padding: "12px 12px 34px",
            color: C.ink, fontSize: 12.5, lineHeight: 1.4, cursor: "pointer", position: "relative", minHeight: 92 } },
          e,
          ce("span", { style: { position: "absolute", left: 12, bottom: 10, fontSize: 13, color: C.disp } }, "✦")))),
      ce("div", { style: { display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 } },
        esempi.slice(4).map((e, i) => ce("button", { key: i, onClick: () => invia(e),
          style: { background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 18, padding: "7px 12px", color: C.mut, fontSize: 11.5, cursor: "pointer", textAlign: "left" } }, e))),
      ce(IaStato, { ia: ia })),

    /* `paddingBottom` non e' estetica: la barra di scrittura e' appiccicata
       in basso e senza questo spazio l'ultimo messaggio le finisce sotto —
       cioe' proprio il pulsante "Scrivi", e il tocco andrebbe nel campo di
       testo invece che sulla conferma. */
    /* `paddingBottom` non e' estetica: la barra di scrittura e' appiccicata
       in basso e senza questo spazio l'ultimo messaggio le finisce sotto —
       e sotto ci sono i pulsanti (conferma una proposta, ascolta, copia),
       quindi il tocco andrebbe nel campo di testo invece che sull'azione.
       Misurato in Chromium a 390×844: la barra e' alta 58, le azioni sotto
       l'ultima risposta ne chiedono altri 24. */
    ce("div", { style: { display: "flex", flexDirection: "column", gap: 16, marginTop: 16, paddingBottom: 84, flex: msgs.length ? 1 : 0 } },
      msgs.map(m => m.role === "user"
        /* La DOMANDA sta in un fumetto, a destra. La risposta no: testo
           pieno con il segno a lato. Invertirli fa sembrare l'app un modulo
           invece di un assistente. */
        ? ce("div", { key: m.id, className: "fin-sale", style: { alignSelf: "flex-end", maxWidth: "88%", display: "flex", flexDirection: "column", alignItems: "flex-end" } },
            ce("div", { style: { background: C.panel2, border: `1px solid ${C.line}`, borderRadius: 16, borderBottomRightRadius: 5, padding: "9px 13px", fontSize: 13.5, color: C.ink, lineHeight: 1.5, whiteSpace: "pre-wrap" } }, m.text),
            !busy && ce("button", { onClick: () => modifica(m.id + 1, m.text), title: "Modifica e richiedi",
              "aria-label": "Modifica questa domanda",
              style: { background: "none", border: "none", color: C.faint, fontSize: 10.5, fontWeight: 700, cursor: "pointer", padding: "4px 2px 0" } }, "✎ modifica"))
        : ce("div", { key: m.id, className: "fin-sale", style: { display: "flex", gap: 9 } },
            ce("div", { style: { flex: "0 0 auto", width: 26, height: 26, borderRadius: 13, background: `linear-gradient(135deg, ${C.disp} 0%, #5AC8FA 100%)`, color: "#08131C", fontWeight: 700, fontSize: 13, display: "flex", alignItems: "center", justifyContent: "center", marginTop: 1 } }, "✦"),
            ce("div", { style: { flex: 1, minWidth: 0 } },
              /* Prima il numero calcolato dai dati, poi la lettura del
                 modello: se le due cose non coincidono si vede subito. */
              m.calc && m.calc.testo && ce("div", { style: { background: C.panel, border: `1px solid ${C.line}`, borderRadius: 12, padding: 12 } },
                ce("div", { style: { fontSize: 9.5, letterSpacing: .8, color: C.disp, fontWeight: 700 } }, "CALCOLATO DAI TUOI DATI"),
                ce("div", { style: { fontSize: 13, fontWeight: 700, color: C.ink, marginTop: 5 } }, m.calc.titolo),
                ce("div", { style: { marginTop: 4 } }, ce(FinTesto, { testo: m.calc.testo, colore: C.mut })),
                ce(FinTabella, { tabella: m.calc.tabella }),
                m.calc.nota && ce("div", { style: { fontSize: 10.5, color: C.faint, marginTop: 8, lineHeight: 1.45 } }, m.calc.nota)),
              /* Due schede, due nature: si costruisce un dato nuovo (modulo
                 modificabile) oppure si tocca una riga che esiste gia'
